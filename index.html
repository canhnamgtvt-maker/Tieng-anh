<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinh Phục Tiếng Anh - Vừa Học Vừa Chơi</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; --primary-hover: #4f46e5;
            --success: #10b981; --danger: #f43f5e; --warning: #f59e0b;
            --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #fae8ff 100%);
            --card-bg: #ffffff; --text-color: #1e293b;
        }
        body {
            font-family: 'Nunito', sans-serif; background: var(--bg-gradient); color: var(--text-color);
            margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            width: 100%; max-width: 850px; background: var(--card-bg); padding: 35px;
            border-radius: 24px; box-shadow: 0 20px 40px rgba(99, 102, 241, 0.15); border: 4px solid #ffffff;
        }
        h1, h2, h3 { color: var(--primary); text-align: center; }
        h1 { font-weight: 800; font-size: 28px; margin-bottom: 10px; }
        .screen { display: none; animation: fadeIn 0.3s ease-in-out; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .tab-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .tab-btn {
            background: #f1f5f9; border: none; padding: 10px 18px; font-size: 15px; font-weight: 700;
            border-radius: 14px; cursor: pointer; color: #64748b; transition: all 0.3s;
        }
        .tab-btn.active { background: var(--primary); color: white; transform: translateY(-2px); box-shadow: 0 8px 15px rgba(99,102,241,0.3); }
        .exam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 20px; max-height: 400px; overflow-y: auto; padding: 8px; }
        .exam-btn {
            background: linear-gradient(135deg, #e0e7ff 0%, #ede9fe 100%); color: var(--primary); border: 2px solid #c7d2fe;
            padding: 14px; font-size: 14px; font-weight: 700; border-radius: 14px; cursor: pointer; transition: all 0.2s; text-align: center;
        }
        .exam-btn:hover { background: var(--primary); color: white; transform: translateY(-3px); box-shadow: 0 6px 15px rgba(99,102,241,0.3); }
        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; }
        .home-btn { background: #f1f5f9; color: #475569; border: none; padding: 8px 14px; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .home-btn:hover { background: #e2e8f0; color: #1e293b; }
        .question-box { font-size: 19px; font-weight: 700; margin-bottom: 25px; background: #f8fafc; padding: 20px; border-radius: 16px; border-left: 6px solid var(--primary); }
        .options-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
        .option-item { background: #ffffff; border: 2px solid #e2e8f0; padding: 14px 18px; border-radius: 14px; cursor: pointer; font-size: 16px; font-weight: 600; transition: all 0.2s; }
        .option-item:hover { background: #f8fafc; transform: translateX(4px); }
        .option-item.selected { background: #eef2ff; border-color: var(--primary); color: var(--primary); }
        .quiz-footer { display: flex; justify-content: space-between; align-items: center; }
        button.btn { background: var(--primary); color: white; border: none; padding: 12px 28px; font-size: 16px; font-weight: 700; border-radius: 14px; cursor: pointer; transition: all 0.2s; }
        button.btn:hover { background: var(--primary-hover); transform: translateY(-2px); }
        button.btn-secondary { background: #cbd5e1; color: #475569; }
        button.btn-secondary:hover { background: #94a3b8; }
        .score-badge { font-size: 42px; font-weight: 800; color: var(--success); margin: 10px 0; text-align: center;}
        .analysis-box { background: #fffbeb; border-left: 6px solid var(--warning); padding: 20px; margin-bottom: 25px; border-radius: 12px; }
        .detail-table-container { max-height: 350px; overflow-y: auto; border: 2px solid #f1f5f9; border-radius: 16px; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 14px; border-bottom: 1px solid #f1f5f9; font-size: 15px; }
        th { background: #f8fafc; position: sticky; top: 0; font-weight: 700; }
        .text-correct { color: var(--success); font-weight: 700; }
        .text-incorrect { color: var(--danger); font-weight: 700; }
        .explanation { font-size: 14px; color: #475569; margin-top: 6px; background: #f8fafc; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div id="screen-select" class="screen active">
        <h1>🚀 Chinh Phục Tiếng Anh Vui Nhộn 🌟</h1>
        <div class="tab-container">
            <button class="tab-btn active" id="tabMixed" onclick="switchTab('mixed')">🔥 20 Đề Tổng Hợp</button>
            <button class="tab-btn" id="tabPractice" onclick="switchTab('practice')">📚 7 Đề Ôn Tập</button>
            <button class="tab-btn" id="tabTopic" onclick="switchTab('topic')">🎯 8 Đề Chuyên Đề</button>
        </div>
        <p style="text-align: center; color: #64748b; font-weight: 600;" id="selectDesc">Chọn đề tổng hợp bên dưới để bắt đầu thử thách</p>
        <div class="exam-grid" id="examGrid"></div>
    </div>

    <div id="screen-quiz" class="screen">
        <div class="quiz-header">
            <button class="home-btn" onclick="confirmHome()">🏠 Về Trang Chủ</button>
            <span id="examTitle" style="font-weight: 700; color: var(--primary); font-size: 16px;">Đề thi</span>
            <span id="questionCounter" style="font-weight: 700; background: #eef2ff; color: var(--primary); padding: 6px 14px; border-radius: 10px;">Câu 1</span>
        </div>
        <div class="question-box" id="questionText"></div>
        <div class="options-list" id="optionsList"></div>
        <div class="quiz-footer">
            <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()">⬅ Quay lại</button>
            <button class="btn" id="nextBtn" onclick="nextQuestion()">Câu tiếp theo ➡</button>
        </div>
    </div>

    <div id="screen-result" class="screen">
        <h2>🎉 Hoàn Thành Xuất Sắc Thử Thách! 🎉</h2>
        <div class="score-badge" id="scoreBadge"></div>
        <div class="analysis-box" id="analysisBox">
            <h3>📊 Đánh giá năng lực & Hướng dẫn:</h3>
            <div id="analysisText" style="line-height: 1.6; font-weight: 600;"></div>
        </div>
        <h3>📝 Bảng chi tiết đáp án</h3>
        <div class="detail-table-container">
            <table>
                <thead><tr><th style="width:8%;">Câu</th><th style="width:42%;">Câu hỏi & Đáp án</th><th style="width:50%;">Kết quả & Giải thích</th></tr></thead>
                <tbody id="resultTableBody"></tbody>
            </table>
        </div>
        <div style="text-align: center;"><button class="btn" onclick="returnToSelect()">🏠 Chọn Đề Khác</button></div>
    </div>
</div>

<script>
    const tPrep = "prepositionTime", tHow = "howMuchMany", tSome = "someAny", tSingular = "singularPlural";
    const tObj = "objectPronoun", tBe = "toBe", tWh = "whQuestion";

    const topics = {
        [tPrep]: { name: "Giới từ chỉ thời gian", theory: "IN: tháng, năm, mùa, buổi. ON: thứ, ngày tháng. AT: giờ, mốc thời điểm (at night)." },
        [tHow]: { name: "How much & How many", theory: "HOW MANY + số nhiều đếm được. HOW MUCH + không đếm được/giá tiền." },
        [tSome]: { name: "Some & Any", theory: "SOME: khẳng định, mời/đề nghị. ANY: phủ định (not), nghi vấn." },
        [tSingular]: { name: "Số ít sang Số nhiều", theory: "is->are, a/an->bỏ. Thêm s/es. Bất quy tắc: child->children, foot->feet, tooth->teeth, man->men." },
        [tObj]: { name: "Đại từ tân ngữ", theory: "Đứng sau động từ/giới từ: I->me, he->him, she->her, we->us, they->them." },
        [tBe]: { name: "Động từ To be", theory: "I->am; He/She/It->is; We/You/They->are." },
        [tWh]: { name: "Từ hỏi", theory: "What(vật), Who(người), Where(nơi chốn), When(thời gian), Why(lý do), How(cách thức)." }
    };

    const optPrep = ["in", "on", "at", "by"];
    const optHow = ["How much", "How many", "What", "Which"];
    const optSome = ["some", "any", "a", "an"];

    // Kho 7 Đề thực chiến (Giảm kích thước mã nguồn để chống đơ trình duyệt)
    const pExams = [
        [ // Đề 1
            {q:"I play pickleball _______ Sunday morning.", o:optPrep, c:1, t:tPrep, e:"Thứ kết hợp buổi dùng 'on'."},
            {q:"The osmanthus tree was planted _______ 2023.", o:optPrep, c:0, t:tPrep, e:"Năm dùng 'in'."},
            {q:"We usually have breakfast _______ 7 o'clock.", o:optPrep, c:2, t:tPrep, e:"Giờ dùng 'at'."},
            {q:"My birthday is _______ October.", o:optPrep, c:0, t:tPrep, e:"Tháng dùng 'in'."},
            {q:"He goes to the park _______ the weekend.", o:optPrep, c:2, t:tPrep, e:"Cụm 'at the weekend'."},
            {q:"The meeting starts _______ Monday.", o:optPrep, c:1, t:tPrep, e:"Thứ dùng 'on'."},
            {q:"She drinks brown rice tea _______ the morning.", o:optPrep, c:0, t:tPrep, e:"'in the morning'."},
            {q:"The children sleep _______ night.", o:optPrep, c:2, t:tPrep, e:"'at night'."},

            {q:"My family travels _______ summer.", o:optPrep, c:0, t:tPrep, e:"Mùa dùng 'in'."},
            {q:"_______ racquets do you have?", o:optHow, c:1, t:tHow, e:"Đếm được dùng How many."},
            {q:"_______ milk is in the bottle?", o:optHow, c:0, t:tHow, e:"Không đếm được dùng How much."},
            {q:"_______ time do you spend in the garden?", o:optHow, c:0, t:tHow, e:"Time không đếm được -> How much."},
            {q:"_______ students are in the classroom?", o:optHow, c:1, t:tHow, e:"Students đếm được -> How many."},
            {q:"_______ rice do you want?", o:optHow, c:0, t:tHow, e:"Rice không đếm được -> How much."},
            {q:"_______ birds are flying in the sky?", o:optHow, c:1, t:tHow, e:"Birds đếm được -> How many."},
            {q:"_______ water does the tree need?", o:optHow, c:0, t:tHow, e:"Water không đếm được -> How much."},
            {q:"_______ apples are on the table?", o:optHow, c:1, t:tHow, e:"Apples đếm được -> How many."},
            {q:"_______ money is in the wallet?", o:optHow, c:0, t:tHow, e:"Money không đếm được -> How much."},
            {q:"_______ toys does she have?", o:optHow, c:1, t:tHow, e:"Toys đếm được -> How many."},
            {q:"There is _______ yogurt in the fridge.", o:optSome, c:0, t:tSome, e:"Khẳng định dùng some."},
            {q:"I don't have _______ red dates for the tea.", o:optSome, c:1, t:tSome, e:"Phủ định dùng any."},
            {q:"Are there _______ flowers in the garden?", o:optSome, c:1, t:tSome, e:"Câu hỏi dùng any."},
            {q:"He has _______ new books on the desk.", o:optSome, c:0, t:tSome, e:"Khẳng định dùng some."},
            {q:"Is there _______ cheese on the plate?", o:optSome, c:1, t:tSome, e:"Câu hỏi dùng any."},
            {q:"He is a boy. (Sang số nhiều)", o:["They are boys.","We are boys.","He are boys.","It is boys."], c:0, t:tSingular, e:"He->They, is->are, boy->boys."},
            {q:"It is a tall tree.", o:["They are tall trees.","It is tall trees.","We are tall tree.","Them are tall trees."], c:0, t:tSingular, e:"It->They, is->are, tree->trees."},
            {q:"She is a teacher.", o:["They are teachers.","She are teachers.","We is teachers.","Thems are teacher."], c:0, t:tSingular, e:"She->They, teacher->teachers."},
            {q:"I am a student.", o:["We are students.","They are student.","We is student.","I are students."], c:0, t:tSingular, e:"I->We, student->students."},
            {q:"It is a sweet apple.", o:["They are sweet apples.","It are sweet apples.","We are sweet apple.","They is sweet apples."], c:0, t:tSingular, e:"It->They, apple->apples."}
        ],
        [ // Đề 2
            {q:"We go to bed _______ midnight.", o:optPrep, c:2, t:tPrep, e:"'at midnight'."},
            {q:"The party is _______ December 25th.", o:optPrep, c:1, t:tPrep, e:"Ngày cụ thể dùng 'on'."},
            {q:"I saw him _______ the afternoon.", o:optPrep, c:0, t:tPrep, e:"'in the afternoon'."},
            {q:"The train arrives _______ 5:30 p.m.", o:optPrep, c:2, t:tPrep, e:"Giờ dùng 'at'."},

            {q:"_______ homework did the teacher give?", o:optHow, c:0, t:tHow, e:"Homework không đếm được."},
            {q:"_______ chairs are in the living room?", o:optHow, c:1, t:tHow, e:"Chairs đếm được."},
            {q:"_______ juice is left in the glass?", o:optHow, c:0, t:tHow, e:"Juice không đếm được."},
            {q:"_______ cars are driving on the highway?", o:optHow, c:1, t:tHow, e:"Cars đếm được."},
            {q:"_______ advice did your father give you?", o:optHow, c:0, t:tHow, e:"Advice không đếm được."},
            {q:"_______ days are there in August?", o:optHow, c:1, t:tHow, e:"Days đếm được."},
            {q:"_______ bread is on the table?", o:optHow, c:0, t:tHow, e:"Bread không đếm được."},
            {q:"_______ friends are playing outside?", o:optHow, c:1, t:tHow, e:"Friends đếm được."},
            {q:"We need _______ avocados for breakfast.", o:optSome, c:0, t:tSome, e:"Khẳng định dùng some."},
            {q:"She doesn't read _______ books in the evening.", o:optSome, c:1, t:tSome, e:"Phủ định dùng any."},
            {q:"Do you have _______ free time today?", o:optSome, c:1, t:tSome, e:"Câu hỏi dùng any."},
            {q:"There are _______ ducks swimming in the lake.", o:optSome, c:0, t:tSome, e:"Khẳng định dùng some."},
            {q:"There isn't _______ meat in the soup.", o:optSome, c:1, t:tSome, e:"Phủ định dùng any."},
            {q:"The dictionary is heavy.", o:["The dictionaries are heavy.","The dictionarys are heavy.","The dictionaries is heavy.","The dictionary are heavy."], c:0, t:tSingular, e:"y->ies (dictionaries)."},
            {q:"He has a new car.", o:["They have new cars.","They has new cars.","He have new cars.","They are new cars."], c:0, t:tSingular, e:"has->have, car->cars."},
            {q:"It is a sharp knife.", o:["They are sharp knives.","They are sharp knifes.","It are sharp knives.","They is sharp knives."], c:0, t:tSingular, e:"knife->knives."},
            {q:"She is a happy woman.", o:["They are happy women.","They are happy womans.","She are happy women.","They is happy women."], c:0, t:tSingular, e:"woman->women."},
            {q:"It is a beautiful flower.", o:["They are beautiful flowers.","It are beautiful flowers.","They is beautiful flowers.","We are beautiful flower."], c:0, t:tSingular, e:"flower->flowers."}
        ],
        [ // Đề 3
            {q:"My uncle visited us _______ April 30th.", o:optPrep, c:1, t:tPrep, e:"Ngày cụ thể dùng 'on'."},
            {q:"We always have a big dinner _______ New Year's Eve.", o:optPrep, c:1, t:tPrep, e:"Lễ cụ thể dùng 'on'."},
            {q:"The cat is sleeping _______ the sofa.", o:optPrep, c:1, t:tPrep, e:"Trên mặt phẳng dùng 'on'."},
            {q:"School finishes _______ 4:30 p.m.", o:optPrep, c:2, t:tPrep, e:"Giờ dùng 'at'."},
            {q:"I like to read books _______ the evening.", o:optPrep, c:0, t:tPrep, e:"'in the evening'."},
            {q:"He was in Hanoi _______ 2021.", o:optPrep, c:0, t:tPrep, e:"Năm dùng 'in'."},
            {q:"They are waiting _______ the bus stop.", o:optPrep, c:2, t:tPrep, e:"Trạm chờ dùng 'at'."},
            {q:"The picture hangs _______ the wall.", o:optPrep, c:1, t:tPrep, e:"Trên tường dùng 'on'."},
            {q:"It rains a lot _______ summer.", o:optPrep, c:0, t:tPrep, e:"Mùa dùng 'in'."},
            {q:"We have English class _______ Tuesday.", o:optPrep, c:1, t:tPrep, e:"Thứ dùng 'on'."},
            {q:"_______ coffee do you drink every day?", o:optHow, c:0, t:tHow, e:"Coffee không đếm được."},
            {q:"_______ pencils are there in your pencil case?", o:optHow, c:1, t:tHow, e:"Pencils đếm được."},
            {q:"_______ information did you find on the internet?", o:optHow, c:0, t:tHow, e:"Information không đếm được."},
            {q:"_______ computers are there in the IT room?", o:optHow, c:1, t:tHow, e:"Computers đếm được."},
            {q:"_______ honey do we need for the cake?", o:optHow, c:0, t:tHow, e:"Honey không đếm được."},
            {q:"_______ trees are planted in the park?", o:optHow, c:1, t:tHow, e:"Trees đếm được."},
            {q:"_______ sand is on the beach?", o:optHow, c:0, t:tHow, e:"Sand không đếm được."},
            {q:"_______ windows does your house have?", o:optHow, c:1, t:tHow, e:"Windows đếm được."},
            {q:"_______ oil is left in the bottle?", o:optHow, c:0, t:tHow, e:"Oil không đếm được."},
            {q:"_______ pairs of socks do you want to buy?", o:optHow, c:1, t:tHow, e:"Pairs đếm được."},
            {q:"I would like _______ tea, please.", o:optSome, c:0, t:tSome, e:"Lời mời/yêu cầu dùng some."},
            {q:"There aren't _______ oranges in the basket.", o:optSome, c:1, t:tSome, e:"Phủ định dùng any."},
            {q:"Do you have _______ water?", o:optSome, c:1, t:tSome, e:"Câu hỏi dùng any."},
            {q:"She doesn't have _______ pens in her bag.", o:optSome, c:1, t:tSome, e:"Phủ định dùng any."},
            {q:"We need _______ butter for this recipe.", o:optSome, c:0, t:tSome, e:"Khẳng định dùng some."},
            {q:"The baby is crying.", o:["The babies are crying.","The babys are crying.","The babies is crying.","The baby are crying."], c:0, t:tSingular, e:"baby->babies."},
            {q:"She is a kind person.", o:["They are kind persons.","They are kind people.","Both are correct.","She are kind people."], c:2, t:tSingular, e:"Person -> people/persons đều đúng."},

        ],
        [ // Đề 4
            {q:"The flowers bloom _______ spring.", o:optPrep, c:0, t:tPrep, e:"Mùa dùng 'in'."},
            {q:"We have lunch _______ 12 o'clock.", o:optPrep, c:2, t:tPrep, e:"Giờ dùng 'at'."},
            {q:"I will see you _______ Wednesday morning.", o:optPrep, c:1, t:tPrep, e:"Thứ+buổi dùng 'on'."},

            {q:"Independence Day is _______ September 2nd.", o:optPrep, c:1, t:tPrep, e:"Ngày cụ thể dùng 'on'."},
            {q:"_______ salt is in this soup?", o:optHow, c:0, t:tHow, e:"Salt không đếm được."},
            {q:"_______ animals live in the zoo?", o:optHow, c:1, t:tHow, e:"Animals đếm được."},
            {q:"_______ pepper should I add?", o:optHow, c:0, t:tHow, e:"Pepper không đếm được."},

    let allExams = [], curIdx = 0, curQIdx = 0, uAns = [], curMode = 'mixed';
    const shuffle = a => [...a].sort(()=>0.5-Math.random());

    function genMixed() {
        allExams = []; let keys = Object.keys(qBank);
        for(let i=0; i<20; i++){
            let ex = [];
            keys.forEach(k => {
                let pool = shuffle(qBank[k]);
                pool.slice(0, 4).forEach(item => ex.push({...item, t:k}));
            });
            allExams.push(shuffle(ex).map((itm, i)=>({ ...itm, id:i+1, q:`(${i+1}) ${itm.q}` })));
        }
    }

    function genTopic() {
        allExams = [];
        Object.keys(qBank).forEach(k => {
            let pool = qBank[k];
            for(let i=0; i<8; i++){
                let sPool = shuffle(pool);
                let ex = [];
                for(let j=0; j<25; j++) {
                    let itm = sPool[j%sPool.length];
                    ex.push({...itm, id:j+1, q:`(${j+1}) ${itm.q}`, t:k});
                }
                allExams.push(ex);
            }
        });
    }

    function genPractice() {
        allExams = pExams.map(ex => ex.map((itm, i) => ({ ...itm, id:i+1, q:`(${i+1}) ${itm.q}` })));
    }

    function switchTab(mode) {
        curMode = mode;
        ['Mixed','Practice','Topic'].forEach(m => 
            document.getElementById('tab'+m).classList.toggle('active', mode===m.toLowerCase()));
        
        let desc = document.getElementById('selectDesc');
        if(mode==='mixed') { desc.innerText = "Chọn đề tổng hợp bên dưới (Phân bổ đều)"; genMixed(); }
        else if(mode==='practice') { desc.innerText = "Chọn đề ôn tập thực chiến bên dưới (30 câu/đề)"; genPractice(); }
        else { desc.innerText = "Chọn chuyên đề ôn luyện sâu bên dưới (25 câu/đề)"; genTopic(); }
        
        const grid = document.getElementById('examGrid'); grid.innerHTML = '';
        if(mode!=='topic') {
            let len = mode==='mixed'?20:7;
            for(let i=0; i<len; i++) {
                let b = document.createElement('button'); b.className='exam-btn'; 
                b.innerText = mode==='mixed'?`Đề Tổng Hợp ${i+1} 🌟`:`Đề Ôn Tập ${i+1} 📚`;
                b.onclick = ()=>start(i); grid.appendChild(b);
            }
        } else {
            Object.keys(topics).forEach((k, tI) => {
                for(let s=0; s<8; s++) {
                    let b = document.createElement('button'); b.className='exam-btn';
                    b.innerText = `${tI+1}.${s+1} ${k.substring(0,4)}... 🎯`;
                    b.onclick = ()=>start(tI*8+s); grid.appendChild(b);
                }
            });
        }
    }

    function init() { switchTab('mixed'); }

    function start(idx) {
        curIdx = idx; curQIdx = 0; 
        uAns = new Array(allExams[curIdx].length).fill(null);
        let tt = "";
        if(curMode==='mixed') tt = `🚀 Tổng Hợp: Đề ${idx+1}`;
        else if(curMode==='practice') tt = `📚 Ôn Tập: Đề ${idx+1}`;
        else tt = `🎯 Chuyên Đề ${ (idx%8)+1 }`;
        
        document.getElementById('examTitle').innerText = tt;
        document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
        document.getElementById('screen-quiz').classList.add('active');
        renderQ();
    }

    function renderQ() {
        let q = allExams[curIdx][curQIdx], tot = allExams[curIdx].length;
        document.getElementById('questionCounter').innerText = `Câu ${curQIdx+1} / ${tot}`;
        document.getElementById('questionText').innerText = q.q;
        let opts = document.getElementById('optionsList'); opts.innerHTML = '';
        q.o.forEach((opt, i) => {
            let d = document.createElement('div'); d.className = 'option-item '+(uAns[curQIdx]===i?'selected':'');
            d.innerText = `${String.fromCharCode(65+i)}. ${opt}`;
            d.onclick = ()=>{ uAns[curQIdx]=i; renderQ(); }; opts.appendChild(d);
        });
        document.getElementById('prevBtn').style.display = curQIdx===0?'none':'block';
        document.getElementById('nextBtn').innerText = curQIdx===tot-1?'Nộp Bài 🎯':'Câu tiếp theo ➡';
    }

    function confirmHome() { if(confirm("Bạn muốn quay về trang chủ? Tiến trình sẽ không lưu.")) {
        document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
        document.getElementById('screen-select').classList.add('active');
    }}
    function returnToSelect() { confirmHome(); }
    function prevQuestion() { if(curQIdx>0) { curQIdx--; renderQ(); } }
    function nextQuestion() { if(curQIdx < allExams[curIdx].length-1) { curQIdx++; renderQ(); } else finish(); }

    function finish() {
        let sc = 0, stats = {};
        for(let k in topics) stats[k] = { w:0, n:topics[k].name, th:topics[k].theory };
        let tbody = document.getElementById('resultTableBody'); tbody.innerHTML = '';
        allExams[curIdx].forEach((q, i) => {
            let isC = uAns[i]===q.c; if(isC) sc++; else if(stats[q.t]) stats[q.t].w++;
            let uT = uAns[i]!==null ? `${String.fromCharCode(65+uAns[i])}. ${q.o[uAns[i]]}` : "Chưa chọn";
            let cT = `${String.fromCharCode(65+q.c)}. ${q.o[q.c]}`;
            tbody.innerHTML += `<tr><td><b>${i+1}</b></td>
                <td><div>${q.q}</div><div style="font-size:13px;margin-top:4px;">Bạn chọn: <span style="color:var(--${isC?'success':'danger'})">${uT}</span></div></td>
                <td><div><span class="${isC?'text-correct':'text-incorrect'}">${isC?'Đúng':'Sai'}</span></div>
                ${!isC?`<div style="font-size:13px;">Đáp án đúng: <b>${cT}</b></div>`:''}
                <div class="explanation"><b>Hướng dẫn:</b> ${q.e}</div></td></tr>`;
        });
        document.getElementById('scoreBadge').innerText = `${sc} / ${allExams[curIdx].length}`;
        let badT = null, maxW = -1;
        for(let k in stats) if(stats[k].w > maxW) { maxW = stats[k].w; badT = stats[k]; }
        let txt = document.getElementById('analysisText');
        if(maxW===0) txt.innerHTML = "🌟 <b>Hoàn hảo!</b> Bạn đã đúng 100%.";
        else txt.innerHTML = `📌 Bạn cần ôn thêm: <b style="color:var(--danger)">${badT.n}</b> (sai ${maxW} câu).<br><div style="background:#fff;padding:10px;border-radius:8px;border:1px solid #fcd34d;margin-top:8px;">${badT.th}</div>`;
        
        document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
        document.getElementById('screen-result').classList.add('active');
    }

    window.onload = init;
</script>
</body>
</html>
