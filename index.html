<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinh Phục Tiếng Anh - Vui Học Mỗi Ngày</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; --primary-hover: #4f46e5;
            --success: #10b981; --danger: #f43f5e; --warning: #f59e0b;
            --accent: #8b5cf6; --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #fae8ff 100%);
            --card-bg: #ffffff; --text-color: #1e293b;
        }
        body { font-family: 'Nunito', sans-serif; background: var(--bg-gradient); color: var(--text-color); margin: 0; padding: 15px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .container { width: 100%; max-width: 900px; background: var(--card-bg); padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(99, 102, 241, 0.1); border: 4px solid #ffffff; margin-top: 10px; margin-bottom: 20px; }
        h1, h2, h3 { color: var(--primary); text-align: center; }
        h1 { font-weight: 900; font-size: 26px; margin-bottom: 5px; line-height: 1.3; }
        
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .tab-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: #f1f5f9; border: none; padding: 10px 14px; font-size: 15px; font-weight: 800; border-radius: 12px; cursor: pointer; color: #64748b; transition: all 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(99,102,241,0.3); }
        .tab-btn.theory-active { background: var(--accent); color: white; box-shadow: 0 4px 10px rgba(139,92,246,0.3); }

        .btn-history { background: #fff; color: var(--primary); border: 2px solid var(--primary); padding: 8px 16px; font-size: 14px; font-weight: 800; border-radius: 10px; cursor: pointer; transition: all 0.2s; display: block; margin: 0 auto 15px auto; }
        .btn-history:hover { background: var(--primary); color: #fff; }

        .exam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; max-height: 450px; overflow-y: auto; padding: 5px; }
        .exam-btn { background: #eef2ff; color: var(--primary); border: 2px solid #c7d2fe; padding: 12px; font-size: 14px; font-weight: 800; border-radius: 12px; cursor: pointer; transition: all 0.1s; text-align: center; }
        .exam-btn:active { transform: scale(0.95); }
        .exam-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
        
        .theory-menu-btn { background: #f3e8ff; color: #7e22ce; border: 2px solid #e9d5ff; padding: 14px; font-size: 15px; font-weight: 800; border-radius: 12px; cursor: pointer; transition: all 0.1s; text-align: center; }
        .theory-menu-btn:hover { background: #9333ea; color: white; }

        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        .home-btn { background: #f1f5f9; color: #475569; border: none; padding: 6px 12px; border-radius: 8px; font-weight: 800; cursor: pointer; }
        
        .question-box { font-size: 18px; font-weight: 800; margin-bottom: 20px; background: #f8fafc; padding: 15px; border-radius: 12px; border-left: 5px solid var(--primary); }
        .options-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 25px; }
        .option-item { background: #ffffff; border: 2px solid #e2e8f0; padding: 12px 16px; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: 700; transition: all 0.1s; }
        .option-item.selected { background: #eef2ff; border-color: var(--primary); color: var(--primary); }
        
        .quiz-footer { display: flex; justify-content: space-between; align-items: center; }
        button.btn { background: var(--primary); color: white; border: none; padding: 10px 20px; font-size: 15px; font-weight: 800; border-radius: 10px; cursor: pointer; }
        button.btn-secondary { background: #cbd5e1; color: #475569; }
        button.btn-accent { background: var(--accent); }
        
        .theory-card { background: #fff; border: 2px solid #eef2ff; border-radius: 12px; margin-bottom: 15px; padding: 20px; }
        .theory-card h3 { color: var(--accent); margin-top: 0; font-size: 20px; border-bottom: 2px dashed #e0e7ff; padding-bottom: 10px; text-align: left; }
        .theory-rule { background: #f8fafc; padding: 12px; border-left: 5px solid var(--accent); border-radius: 8px; margin-bottom: 15px; font-size: 15px; }
        .prac-container { background: #eef2ff; padding: 15px; border-radius: 10px; font-weight: 700; border: 2px dashed #c7d2fe; display: flex; flex-direction: column; gap: 10px;}
        .prac-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
        .prac-input { border: 2px solid #cbd5e1; padding: 6px 10px; border-radius: 8px; font-weight: 800; width: 120px; text-align: center; color: #334155; }
        .prac-select { border: 2px solid #cbd5e1; padding: 6px 10px; border-radius: 8px; font-weight: 800; color: #334155;}
        
        .score-badge { font-size: 40px; font-weight: 900; color: var(--success); margin: 10px 0; text-align: center; }
        .detail-table-container { max-height: 350px; overflow-y: auto; border: 2px solid #f1f5f9; border-radius: 12px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        th { background: #f8fafc; position: sticky; top: 0; font-weight: 800; color: #475569;}
        .text-correct { color: var(--success); font-weight: 800; }
        .text-incorrect { color: var(--danger); font-weight: 800; }
    </style>
</head>
<body>

<div class="container">
    <!-- MÀN HÌNH 1: TRANG CHỦ -->
    <div id="screen-select" class="screen active">
        <h1>🚀 Chinh Phục Tiếng Anh 🌟</h1>
        <div class="tab-container">
            <button class="tab-btn active" id="tabMixed" onclick="switchTab('mixed')">🔥 20 Đề Tổng Hợp</button>
            <button class="tab-btn" id="tabPractice" onclick="switchTab('practice')">📚 7 Đề Thực Chiến</button>
            <button class="tab-btn" id="tabTopic" onclick="switchTab('topic')">🎯 90 Đề Chuyên Đề</button>
            <button class="tab-btn" id="tabTheory" onclick="switchTab('theory')">📖 Lý Thuyết & Bài Tập</button>
        </div>
        <button class="btn-history" onclick="showHistory()">📜 Xem Lịch Sử Học Tập</button>
        <p style="text-align: center; color: #64748b; font-weight: 700; font-size: 15px; margin-top: 0;" id="selectDesc">Đang tải...</p>
        <div class="exam-grid" id="examGrid"></div>
    </div>

    <!-- MÀN HÌNH 2: LÀM BÀI THI -->
    <div id="screen-quiz" class="screen">
        <div class="quiz-header">
            <button class="home-btn" onclick="returnToSelect()">🏠 Trang Chủ</button>
            <span id="examTitle" style="font-weight: 800; color: var(--primary); font-size: 16px;">Đề thi</span>
            <span id="questionCounter" style="font-weight: 800; background: #eef2ff; color: var(--primary); padding: 5px 10px; border-radius: 8px;">Câu 1</span>
        </div>
        <div class="question-box" id="questionText"></div>
        <div class="options-list" id="optionsList"></div>
        <div class="quiz-footer">
            <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()">⬅ Quay lại</button>
            <button class="btn" id="nextBtn" onclick="nextQuestion()">Câu tiếp ➡</button>
        </div>
    </div>

    <!-- MÀN HÌNH 3: LÝ THUYẾT -->
    <div id="screen-theory" class="screen">
        <div class="quiz-header">
            <button class="home-btn" onclick="returnToSelect()">🏠 Trang Chủ</button>
            <span style="font-weight: 800; color: var(--accent); font-size: 18px;">📖 Cẩm Nang Ngữ Pháp</span>
            <span style="width: 80px;"></span> 
        </div>
        
        <div id="theoryMenu">
            <p style="text-align: center; color: #64748b; font-weight: 700; margin-bottom: 15px;">Chọn chủ đề để học và thực hành ngay!</p>
            <div class="exam-grid" id="theoryGrid" style="grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));"></div>
        </div>

        <div id="theoryLesson" style="display: none;">
            <div style="margin-bottom: 15px;">
                <button class="btn btn-accent" style="padding: 8px 14px; font-size: 14px;" onclick="backToTheoryMenu()">⬅ Chọn chủ đề khác</button>
            </div>
            <div style="max-height: 450px; overflow-y: auto; padding-right: 5px;" id="theoryContentArea"></div>
        </div>
    </div>

    <!-- MÀN HÌNH 4: KẾT QUẢ -->
    <div id="screen-result" class="screen">
        <h2>🎉 Hoàn Thành Xuất Sắc! 🎉</h2>
        <div class="score-badge" id="scoreBadge"></div>
        <h3 style="text-align: left; margin-bottom: 10px; margin-top: 20px;">📝 Bảng chi tiết đáp án</h3>
        <div class="detail-table-container">
            <table>
                <thead><tr><th style="width:10%;">Câu</th><th style="width:50%;">Đáp án của bạn</th><th style="width:40%;">Kết quả</th></tr></thead>
                <tbody id="resultTableBody"></tbody>
            </table>
        </div>
        <div style="text-align: center;"><button class="btn" onclick="returnToSelect()">🏠 Về Trang Chủ</button></div>
    </div>

    <!-- MÀN HÌNH 5: LỊCH SỬ -->
    <div id="screen-history" class="screen">
        <h2>📜 Lịch Sử Học Tập</h2>
        <div class="detail-table-container">
            <table>
                <thead><tr><th>Thời Gian</th><th>Tên Đề Thi</th><th>Điểm</th></tr></thead>
                <tbody id="historyTableBody"></tbody>
            </table>
        </div>
        <div style="display: flex; justify-content: center; gap: 10px;">
            <button class="btn btn-secondary" onclick="returnToSelect()">🏠 Trang Chủ</button>
            <button class="btn" style="background: var(--danger);" onclick="clearHistory()">🗑 Xóa Lịch Sử</button>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // 1. DỮ LIỆU LÝ THUYẾT & THỰC HÀNH TƯƠNG TÁC
    // ==========================================
    const theoryLessons = {
        plu: {
            title: "1. Số Ít & Số Nhiều",
            content: `
                <div class="theory-card">
                    <h3>Danh từ Số Ít & Số Nhiều</h3>
                    <div class="theory-rule"><b>Quy tắc 1:</b> Thêm "-s" (book ➔ books).<br><b>Quy tắc 2:</b> Tận cùng O,S,CH,X,SH thêm "-es" (box ➔ boxes).<br><b>Quy tắc 3:</b> Phụ âm + Y đổi thành "i" + es (city ➔ cities).<br><b>Quy tắc 4:</b> Bất quy tắc: child ➔ children, foot ➔ feet, tooth ➔ teeth, man ➔ men, woman ➔ women, mouse ➔ mice.</div>
                    <div class="prac-container">
                        <div class="prac-row">✏️ a cat ➔ <input type="text" class="prac-input" data-ans="cats" onkeyup="checkPracInput(this)" placeholder="gõ vào đây..."></div>
                        <div class="prac-row">✏️ a class ➔ <input type="text" class="prac-input" data-ans="classes" onkeyup="checkPracInput(this)"></div>
                        <div class="prac-row">✏️ a foot ➔ <input type="text" class="prac-input" data-ans="feet" onkeyup="checkPracInput(this)"></div>
                    </div>
                </div>`
        },
        obj: {
            title: "2. Đại Từ & Tân Ngữ",
            content: `
                <div class="theory-card">
                    <h3>Đại Từ Nhân Xưng & Tân Ngữ</h3>
                    <div class="theory-rule"><b>Tân ngữ (Object)</b> đứng sau động từ/giới từ để nhận hành động.<br>I ➔ me, You ➔ you, He ➔ him, She ➔ her, It ➔ it, We ➔ us, They ➔ them.</div>
                    <div class="prac-container">
                        <div class="prac-row">I love my mom. I love <select class="prac-select" data-ans="her" onchange="checkPracSelect(this)"><option value="">--Chọn--</option><option value="she">she</option><option value="her">her</option><option value="him">him</option></select></div>
                        <div class="prac-row">Look at Tom. Look at <select class="prac-select" data-ans="him" onchange="checkPracSelect(this)"><option value="">--Chọn--</option><option value="he">he</option><option value="him">him</option></select>!</div>
                    </div>
                </div>`
        },
        be: {
            title: "3. Động từ To be",
            content: `
                <div class="theory-card">
                    <h3>Động từ To be (Am/Is/Are)</h3>
                    <div class="theory-rule"><b>AM:</b> đi với I.<br><b>IS:</b> đi với He, She, It, số ít.<br><b>ARE:</b> đi với We, You, They, số nhiều.</div>
                    <div class="prac-container">
                        <div class="prac-row">✏️ I <input type="text" class="prac-input" data-ans="am" onkeyup="checkPracInput(this)"> a student.</div>
                        <div class="prac-row">✏️ The dogs <input type="text" class="prac-input" data-ans="are" onkeyup="checkPracInput(this)"> playing.</div>
                    </div>
                </div>`
        },
        wh: {
            title: "4. Từ để hỏi (Wh-q)",
            content: `
                <div class="theory-card">
                    <h3>Từ Để Hỏi</h3>
                    <div class="theory-rule">What (Cái gì), Who (Ai), Where (Ở đâu), When (Khi nào), Why (Tại sao), How (Như thế nào / Bao nhiêu tuổi).</div>
                    <div class="prac-container">
                        <div class="prac-row"><select class="prac-select" data-ans="What" onchange="checkPracSelect(this)"><option value="">--Chọn--</option><option value="What">What</option><option value="Who">Who</option></select> is your name?</div>
                        <div class="prac-row"><select class="prac-select" data-ans="Where" onchange="checkPracSelect(this)"><option value="">--Chọn--</option><option value="Where">Where</option><option value="When">When</option></select> do you live?</div>
                    </div>
                </div>`
        },
        prep: {
            title: "5. Giới từ Thời Gian",
            content: `
                <div class="theory-card">
                    <h3>Giới từ In / On / At</h3>
                    <div class="theory-rule"><b>IN:</b> Tháng, Năm, Mùa, Buổi.<br><b>ON:</b> Thứ, Ngày tháng cụ thể.<br><b>AT:</b> Giờ, Dịp lễ, Đêm/Trưa (at night, at noon).</div>
                    <div class="prac-container">
                        <div class="prac-row">✏️ I wake up <input type="text" class="prac-input" data-ans="at" onkeyup="checkPracInput(this)"> 6 o'clock.</div>
                        <div class="prac-row">✏️ We don't go to school <input type="text" class="prac-input" data-ans="on" onkeyup="checkPracInput(this)"> Sundays.</div>
                    </div>
                </div>`
        },
        some: {
            title: "6. Some & Any",
            content: `
                <div class="theory-card">
                    <h3>Some & Any</h3>
                    <div class="theory-rule"><b>SOME:</b> Câu Khẳng định, Lời mời/đề nghị.<br><b>ANY:</b> Câu Phủ định (có not) và Hỏi nghi vấn.</div>
                    <div class="prac-container">
                        <div class="prac-row">I don't have <select class="prac-select" data-ans="any" onchange="checkPracSelect(this)"><option value="">--Chọn--</option><option value="some">some</option><option value="any">any</option></select> pens.</div>
                        <div class="prac-row">Would you like <select class="prac-select" data-ans="some" onchange="checkPracSelect(this)"><option value="">--Chọn--</option><option value="some">some</option><option value="any">any</option></select> milk?</div>
                    </div>
                </div>`
        },
        how: {
            title: "7. How much / How many",
            content: `
                <div class="theory-card">
                    <h3>Hỏi số lượng</h3>
                    <div class="theory-rule"><b>HOW MANY:</b> + Danh từ đếm được SỐ NHIỀU (thường có s).<br><b>HOW MUCH:</b> + Danh từ KHÔNG đếm được (nước, tiền) / Giá Tiền.</div>
                    <div class="prac-container">
                        <div class="prac-row"><select class="prac-select" data-ans="How much" onchange="checkPracSelect(this)"><option value="">--Chọn--</option><option value="How much">How much</option><option value="How many">How many</option></select> money do you have?</div>
                        <div class="prac-row"><select class="prac-select" data-ans="How many" onchange="checkPracSelect(this)"><option value="">--Chọn--</option><option value="How much">How much</option><option value="How many">How many</option></select> students are there?</div>
                    </div>
                </div>`
        },
        presSimp: {
            title: "8. Hiện Tại Đơn",
            content: `
                <div class="theory-card">
                    <h3>Thì Hiện Tại Đơn</h3>
                    <div class="theory-rule"><b>(+)</b> Số nhiều + V nguyên thể. Số ít + V(s/es).<br><b>(-)</b> Số nhiều + don't + V. Số ít + doesn't + V.<br><b>(?)</b> Do/Does + S + V?<br>Dấu hiệu: always, usually, often, every day.</div>
                    <div class="prac-container">
                        <div class="prac-row">✏️ He (play) ➔ <input type="text" class="prac-input" data-ans="plays" onkeyup="checkPracInput(this)"> football.</div>
                        <div class="prac-row">✏️ They (go) ➔ <input type="text" class="prac-input" data-ans="go" onkeyup="checkPracInput(this)"> to school.</div>
                    </div>
                </div>`
        },
        presCont: {
            title: "9. Hiện Tại Tiếp Diễn",
            content: `
                <div class="theory-card">
                    <h3>Thì Hiện Tại Tiếp Diễn</h3>
                    <div class="theory-rule"><b>Cấu trúc:</b> S + am/is/are + V-ing.<br><b>Quy tắc:</b> Bỏ 'e' thêm -ing (make ➔ making). Nhân đôi phụ âm (run ➔ running).<br><b>Dấu hiệu:</b> now, at the moment, look!</div>
                    <div class="prac-container">
                        <div class="prac-row">✏️ I (read) ➔ <input type="text" class="prac-input" style="width:130px;" data-ans="am reading" onkeyup="checkPracInput(this)"> now.</div>
                        <div class="prac-row">✏️ Look! Dog (run) ➔ <input type="text" class="prac-input" style="width:130px;" data-ans="is running" onkeyup="checkPracInput(this)">.</div>
                    </div>
                </div>`
        }
    };

    const topicsInfo = [
        { id:"prep", n:"Giới từ thời gian" }, { id:"how", n:"How much/many" }, { id:"some", n:"Some & Any" },
        { id:"plu", n:"Số ít/Số nhiều" }, { id:"obj", n:"Đại từ tân ngữ" }, { id:"be", n:"Động từ To be" },
        { id:"wh", n:"Từ để hỏi" }, { id:"presSimp", n:"Hiện tại Đơn" }, { id:"presCont", n:"Hiện tại Tiếp diễn" }
    ];

    const optPrep = ["in", "on", "at", "by"];
    const optHow = ["How much", "How many", "What", "Which"];
    const optSome = ["some", "any", "a", "an"];

    // 7 ĐỀ THỰC CHIẾN GỐC (Dữ liệu cố định)
    const pExamsData = [
        [ // Đề 1
            {q:"I play pickleball _______ Sunday morning.", o:optPrep, c:1}, {q:"The osmanthus tree was planted _______ 2023.", o:optPrep, c:0}, {q:"We usually have breakfast _______ 7 o'clock.", o:optPrep, c:2}, {q:"My birthday is _______ October.", o:optPrep, c:0}, {q:"He goes to the park _______ the weekend.", o:optPrep, c:2}, {q:"The meeting starts _______ Monday.", o:optPrep, c:1}, {q:"She drinks brown rice tea _______ the morning.", o:optPrep, c:0}, {q:"The children sleep _______ night.", o:optPrep, c:2}, {q:"They are building a road _______ the moment.", o:optPrep, c:2}, {q:"My family travels _______ summer.", o:optPrep, c:0},
            {q:"_______ racquets do you have?", o:optHow, c:1}, {q:"_______ milk is in the bottle?", o:optHow, c:0}, {q:"_______ time do you spend in the garden?", o:optHow, c:0}, {q:"_______ students are in the classroom?", o:optHow, c:1}, {q:"_______ rice do you want?", o:optHow, c:0}, {q:"_______ birds are flying in the sky?", o:optHow, c:1}, {q:"_______ water does the tree need?", o:optHow, c:0}, {q:"_______ apples are on the table?", o:optHow, c:1}, {q:"_______ money is in the wallet?", o:optHow, c:0}, {q:"_______ toys does she have?", o:optHow, c:1},
            {q:"There is _______ yogurt in the fridge.", o:optSome, c:0}, {q:"I don't have _______ red dates for the tea.", o:optSome, c:1}, {q:"Are there _______ flowers in the garden?", o:optSome, c:1}, {q:"He has _______ new books on the desk.", o:optSome, c:0}, {q:"Is there _______ cheese on the plate?", o:optSome, c:1},
            {q:"He is a boy. (Sang số nhiều)", o:["They are boys.", "We are boys.", "He are boys.", "It is boys."], c:0}, {q:"It is a tall tree. (Sang số nhiều)", o:["They are tall trees.", "It is tall trees.", "We are tall tree.", "Them are tall trees."], c:0}, {q:"She is a teacher.", o:["They are teachers.", "She are teachers.", "We is teachers.", "Thems are teacher."], c:0}, {q:"I am a student.", o:["We are students.", "They are student.", "We is student.", "I are students."], c:0}, {q:"It is a sweet apple.", o:["They are sweet apples.", "It are sweet apples.", "We are sweet apple.", "They is sweet apples."], c:0}

        if(mode !== 'topic') {
            let len = mode==='mixed' ? 20 : pExamsData.length;
            for(let i=0; i<len; i++) {
                let b = document.createElement('button'); b.className = 'exam-btn'; 
                b.innerText = mode==='mixed' ? `Đề Tổng Hợp ${i+1} 🌟` : `Đề Ôn Tập ${i+1} 📚`;
                b.onclick = () => start(i); grid.appendChild(b);
            }
        } else {
            topicsInfo.forEach((tInfo, tI) => {
                for(let s=0; s<10; s++) { 
                    let b = document.createElement('button'); b.className = 'exam-btn';
                    b.innerText = `${tI+1}.${s+1} ${tInfo.n.substring(0,12)}... 🎯`;
                    b.onclick = () => start(tI*10+s); grid.appendChild(b);
                }
            });
        }
    }

    function renderTheoryMenu() {
        document.getElementById('theoryMenu').style.display = 'block';
        document.getElementById('theoryLesson').style.display = 'none';
        const theoryGrid = document.getElementById('theoryGrid');
        theoryGrid.innerHTML = '';
        
        Object.keys(theoryLessons).forEach(key => {
            let b = document.createElement('button');
            b.className = 'theory-menu-btn';
            b.innerHTML = `📚 ${theoryLessons[key].title}`;
            b.onclick = () => openTheoryLesson(key);
            theoryGrid.appendChild(b);
        });
    }

    function openTheoryLesson(key) {
        document.getElementById('theoryMenu').style.display = 'none';
        document.getElementById('theoryLesson').style.display = 'block';
        document.getElementById('theoryContentArea').innerHTML = theoryLessons[key].content;
    }

    function backToTheoryMenu() {
        document.getElementById('theoryMenu').style.display = 'block';
        document.getElementById('theoryLesson').style.display = 'none';
        document.getElementById('theoryContentArea').innerHTML = '';
    }

    function checkPracInput(el) {
        let val = el.value.trim().toLowerCase(), ans = el.getAttribute('data-ans').toLowerCase();
        if(val === "") { el.style.borderColor = '#cbd5e1'; el.style.color = '#334155'; return; }
        if(val === ans) { el.style.borderColor = 'var(--success)'; el.style.color = 'var(--success)'; } 
        else { el.style.borderColor = 'var(--danger)'; el.style.color = 'var(--danger)'; }
    }

    function checkPracSelect(el) {
        let val = el.value, ans = el.getAttribute('data-ans');
        if(val === "") { el.style.borderColor = '#cbd5e1'; el.style.color = '#334155'; } 
        else if(val === ans) { el.style.borderColor = 'var(--success)'; el.style.color = 'var(--success)'; } 
        else { el.style.borderColor = 'var(--danger)'; el.style.color = 'var(--danger)'; }
    }

    function start(idx) {
        curIdx = idx; curQIdx = 0; 
        uAns = new Array(allExams[curIdx].length).fill(null);
        let tt = "";
        if(curMode==='mixed') tt = `🚀 Đề Tổng Hợp Số ${idx+1}`;
        else if(curMode==='practice') tt = `📚 Ôn Tập Thực Chiến: Đề Số ${idx+1}`;
        else tt = `🎯 Ôn Tập Chuyên Đề ${ (idx%10)+1 }`;
        
        document.getElementById('examTitle').innerText = tt;
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-quiz').classList.add('active');
        renderQ();
    }

    function renderQ() {
        let q = allExams[curIdx][curQIdx], tot = allExams[curIdx].length;
        document.getElementById('questionCounter').innerText = `Câu ${curQIdx+1} / ${tot}`;
        document.getElementById('questionText').innerText = q.q;
        let opts = document.getElementById('optionsList'); opts.innerHTML = '';
        q.o.forEach((opt, i) => {
            let d = document.createElement('div'); 
            d.className = 'option-item ' + (uAns[curQIdx]===i ? 'selected' : '');
            d.innerText = `${String.fromCharCode(65+i)}. ${opt}`;
            d.onclick = () => { uAns[curQIdx] = i; renderQ(); }; 
            opts.appendChild(d);
        });
        document.getElementById('prevBtn').style.display = curQIdx===0 ? 'none' : 'block';
        document.getElementById('nextBtn').innerText = curQIdx===tot-1 ? 'Nộp Bài 🎯' : 'Câu tiếp theo ➡';
    }

    function returnToSelect() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-select').classList.add('active');
        if(curMode==='theory') switchTab('mixed');
    }
    
    function prevQuestion() { if(curQIdx > 0) { curQIdx--; renderQ(); } }
    function nextQuestion() { if(curQIdx < allExams[curIdx].length-1) { curQIdx++; renderQ(); } else finish(); }

    function saveHistory(examName, score, total) {
        let history = JSON.parse(localStorage.getItem('quizHistory_final_AI') || '[]');
        let dateStr = new Date().toLocaleString('vi-VN');
        history.unshift({ date: dateStr, exam: examName, score: score, total: total });
        if(history.length > 50) history.pop();
        localStorage.setItem('quizHistory_final_AI', JSON.stringify(history));
    }

    function showHistory() {
        let history = JSON.parse(localStorage.getItem('quizHistory_final_AI') || '[]');
        let tbody = document.getElementById('historyTableBody'); tbody.innerHTML = '';
        if(history.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding: 20px;">Bạn chưa làm bài thi nào.</td></tr>';
        } else {
            history.forEach(h => {
                tbody.innerHTML += `<tr><td>${h.date}</td><td style="font-weight:800;color:var(--primary);">${h.exam}</td><td><b><span class="text-correct">${h.score}</span> / ${h.total}</b></td></tr>`;
            });
        }
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-history').classList.add('active');
    }

    function clearHistory() {
        if(confirm('Bạn có chắc chắn muốn xóa toàn bộ lịch sử học tập?')) {
            localStorage.removeItem('quizHistory_final_AI'); showHistory();
        }
    }

    function finish() {
        let sc = 0, tbody = document.getElementById('resultTableBody'); tbody.innerHTML = '';
        
        allExams[curIdx].forEach((q, i) => {
            let isC = uAns[i] === q.c; if(isC) sc++; 
            let uT = uAns[i]!==null ? `${String.fromCharCode(65+uAns[i])}. ${q.o[uAns[i]]}` : "Chưa chọn";
            tbody.innerHTML += `<tr>
                <td><b>${i+1}</b></td>
                <td><div style="font-size: 15px; margin-bottom: 5px;">${q.q}</div><span style="color:var(--${isC?'success':'danger'})">${uT}</span></td>
                <td><span class="${isC?'text-correct':'text-incorrect'}">${isC?'Đúng':'Sai'}</span></td>
            </tr>`;
        });
        
        let totalQ = allExams[curIdx].length;
        document.getElementById('scoreBadge').innerText = `${sc} / ${totalQ}`;
        saveHistory(document.getElementById('examTitle').innerText.replace(/🚀 |📚 |🎯 /g, ''), sc, totalQ);
        
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-result').classList.add('active');
    }

    window.onload = () => switchTab('mixed');
</script>
</body>
</html>
