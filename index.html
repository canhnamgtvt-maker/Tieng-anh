<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinh Phục Tiếng Anh - Vui Học Mỗi Ngày</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; --primary-hover: #4f46e5;
            --success: #10b981; --danger: #f43f5e; --warning: #f59e0b;
            --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #fae8ff 100%);
            --card-bg: #ffffff; --text-color: #1e293b;
        }
        body {
            font-family: 'Nunito', sans-serif; background: var(--bg-gradient); color: var(--text-color);
            margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            width: 100%; max-width: 850px; background: var(--card-bg); padding: 30px;
            border-radius: 24px; box-shadow: 0 20px 40px rgba(99, 102, 241, 0.15); border: 4px solid #ffffff;
        }
        h1, h2, h3 { color: var(--primary); text-align: center; }
        h1 { font-weight: 800; font-size: 26px; margin-bottom: 10px; line-height: 1.3; }
        .screen { display: none; animation: fadeIn 0.3s ease-in-out; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .tab-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .tab-btn {
            background: #f1f5f9; border: none; padding: 10px 18px; font-size: 15px; font-weight: 700;
            border-radius: 14px; cursor: pointer; color: #64748b; transition: all 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .tab-btn.active { background: var(--primary); color: white; transform: translateY(-2px); box-shadow: 0 8px 15px rgba(99,102,241,0.3); }
        
        .exam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 20px; max-height: 400px; overflow-y: auto; padding: 8px; }
        .exam-btn {
            background: linear-gradient(135deg, #e0e7ff 0%, #ede9fe 100%); color: var(--primary); border: 2px solid #c7d2fe;
            padding: 14px; font-size: 14px; font-weight: 700; border-radius: 14px; cursor: pointer; transition: all 0.2s; text-align: center;
        }
        .exam-btn:hover { background: var(--primary); color: white; transform: translateY(-3px); box-shadow: 0 6px 15px rgba(99,102,241,0.3); }
        
        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; }
        .home-btn { background: #f1f5f9; color: #475569; border: none; padding: 8px 14px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .home-btn:hover { background: #e2e8f0; color: #1e293b; }
        
        .question-box { font-size: 19px; font-weight: 700; margin-bottom: 25px; line-height: 1.5; background: #f8fafc; padding: 20px; border-radius: 16px; border-left: 6px solid var(--primary); }
        .options-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
        .option-item { background: #ffffff; border: 2px solid #e2e8f0; padding: 14px 18px; border-radius: 14px; cursor: pointer; font-size: 16px; font-weight: 600; transition: all 0.2s; }
        .option-item:hover { background: #f8fafc; transform: translateX(4px); }
        .option-item.selected { background: #eef2ff; border-color: var(--primary); color: var(--primary); box-shadow: 0 4px 12px rgba(99,102,241,0.15); }
        
        .quiz-footer { display: flex; justify-content: space-between; align-items: center; }
        button.btn { background: var(--primary); color: white; border: none; padding: 12px 26px; font-size: 16px; font-weight: 700; border-radius: 14px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(99,102,241,0.3); }
        button.btn:hover { background: var(--primary-hover); transform: translateY(-2px); }
        button.btn-secondary { background: #cbd5e1; color: #475569; box-shadow: none; }
        button.btn-secondary:hover { background: #94a3b8; }
        
        .score-badge { font-size: 42px; font-weight: 800; color: var(--success); margin: 10px 0; text-align: center; }
        .analysis-box { background: #fffbeb; border-left: 6px solid var(--warning); padding: 20px; margin-bottom: 25px; border-radius: 12px; }
        .detail-table-container { max-height: 350px; overflow-y: auto; border: 2px solid #f1f5f9; border-radius: 16px; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 14px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        th { background: #f8fafc; position: sticky; top: 0; font-weight: 700; }
        .text-correct { color: var(--success); font-weight: 700; }
        .text-incorrect { color: var(--danger); font-weight: 700; }
        .explanation { font-size: 14px; color: #475569; margin-top: 6px; background: #f8fafc; padding: 10px; border-radius: 8px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <div id="screen-select" class="screen active">
        <h1>🚀 Chinh Phục Tiếng Anh Vui Nhộn 🌟</h1>
        <div class="tab-container">
            <button class="tab-btn active" id="tabMixed" onclick="switchTab('mixed')">🔥 20 Đề Tổng Hợp</button>
            <button class="tab-btn" id="tabPractice" onclick="switchTab('practice')">📚 7 Đề Ôn Tập Mới</button>
            <button class="tab-btn" id="tabTopic" onclick="switchTab('topic')">🎯 8 Đề Chuyên Đề</button>
        </div>
        <p style="text-align: center; color: #64748b; font-weight: 600;" id="selectDesc">Đang tải dữ liệu...</p>
        <div class="exam-grid" id="examGrid"></div>
    </div>

    <div id="screen-quiz" class="screen">
        <div class="quiz-header">
            <button class="home-btn" onclick="confirmHome()">🏠 Trang Chủ</button>
            <span id="examTitle" style="font-weight: 700; color: var(--primary); font-size: 16px;">Đề thi</span>
            <span id="questionCounter" style="font-weight: 700; background: #eef2ff; color: var(--primary); padding: 6px 14px; border-radius: 10px;">Câu 1</span>
        </div>
        <div class="question-box" id="questionText"></div>
        <div class="options-list" id="optionsList"></div>
        <div class="quiz-footer">
            <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()">⬅ Quay lại</button>
            <button class="btn" id="nextBtn" onclick="nextQuestion()">Câu tiếp ➡</button>
        </div>
    </div>

    <div id="screen-result" class="screen">
        <h2>🎉 Hoàn Thành Xuất Sắc! 🎉</h2>
        <div class="score-badge" id="scoreBadge"></div>
        <div class="analysis-box" id="analysisBox">
            <h3 style="color: #d97706; margin-top:0;">📊 Phân tích & Hướng dẫn:</h3>
            <div id="analysisText" style="line-height: 1.6; font-weight: 600; font-size: 15px;"></div>
        </div>
        <h3 style="text-align: left; margin-bottom: 10px;">📝 Bảng chi tiết đáp án</h3>
        <div class="detail-table-container">
            <table>
                <thead><tr><th style="width:8%;">Câu</th><th style="width:42%;">Câu hỏi & Đáp án</th><th style="width:50%;">Kết quả & Giải thích</th></tr></thead>
                <tbody id="resultTableBody"></tbody>
            </table>
        </div>
        <div style="text-align: center;"><button class="btn" onclick="returnToSelect()">🏠 Chọn Đề Khác</button></div>
    </div>
</div>

<script>
    // 1. CẤU TRÚC CHỦ ĐỀ & LÝ THUYẾT CHI TIẾT
    const topics = {
        prep: { name: "Giới từ thời gian", theory: "• <b>IN:</b> tháng, năm, mùa, buổi (in 2025, in the morning).<br>• <b>ON:</b> thứ, ngày tháng cụ thể (on Monday, on May 5th).<br>• <b>AT:</b> giờ, mốc thời điểm (at 7:00, at night, at noon)." },
        how: { name: "How much / How many", theory: "• <b>HOW MANY:</b> + danh từ đếm được số nhiều (racquets, students).<br>• <b>HOW MUCH:</b> + danh từ không đếm được (water, sugar, time) hoặc hỏi giá tiền." },
        some: { name: "Some & Any", theory: "• <b>SOME:</b> Dùng trong câu khẳng định, lời mời/đề nghị (Would you like some tea?).<br>• <b>ANY:</b> Dùng trong câu phủ định (don't, isn't) và câu hỏi nghi vấn." },
        plu: { name: "Số ít sang Số nhiều", theory: "• Động từ: is -> are.<br>• Mạo từ a/an -> bị lược bỏ.<br>• Thêm 's' hoặc 'es' (box->boxes).<br>• Bất quy tắc: child->children, foot->feet, tooth->teeth, man->men, mouse->mice, wife->wives." },
        obj: { name: "Đại từ tân ngữ", theory: "Đứng sau động từ hoặc giới từ. Bảng đổi: I->me, you->you, he->him, she->her, it->it, we->us, they->them." },
        be: { name: "Động từ To be", theory: "• <b>AM:</b> đi với I.<br>• <b>IS:</b> đi với He, She, It, số ít.<br>• <b>ARE:</b> đi với We, You, They, số nhiều." },
        wh: { name: "Từ để hỏi (Wh-q)", theory: "What (vật/sự việc), Who (người), Where (nơi chốn), When (thời gian), Why (lý do - trả lời because), How (cách thức/phương tiện)." }
    };

    const optPrep = ["in", "on", "at", "by"];
    const optHow = ["How much", "How many", "What", "Which"];
    const optSome = ["some", "any", "a", "an"];

    // 2. DỮ LIỆU 7 ĐỀ THỰC CHIẾN TỪ NGƯỜI DÙNG (Tuyệt đối không có lỗi cú pháp)
    const pExams = [
        [ // Đề 1
            {q:"I play pickleball _______ Sunday morning.", o:optPrep, c:1, t:"prep", e:"Thứ kết hợp buổi dùng on."},
            {q:"The osmanthus tree was planted _______ 2023.", o:optPrep, c:0, t:"prep", e:"Năm dùng in."},
            {q:"We usually have breakfast _______ 7 o'clock.", o:optPrep, c:2, t:"prep", e:"Mốc giờ cụ thể dùng at."},
            {q:"My birthday is _______ October.", o:optPrep, c:0, t:"prep", e:"Tháng dùng in."},
            {q:"He goes to the park _______ the weekend.", o:optPrep, c:2, t:"prep", e:"Cụm 'at the weekend'."},
            {q:"The meeting starts _______ Monday.", o:optPrep, c:1, t:"prep", e:"Thứ trong tuần dùng on."},
            {q:"She drinks brown rice tea _______ the morning.", o:optPrep, c:0, t:"prep", e:"Cụm 'in the morning'."},
            {q:"The children sleep _______ night.", o:optPrep, c:2, t:"prep", e:"Cụm 'at night'."},
            {q:"They are building a road _______ the moment.", o:optPrep, c:2, t:"prep", e:"Cụm 'at the moment'."},
            {q:"My family travels _______ summer.", o:optPrep, c:0, t:"prep", e:"Mùa dùng in."},
            {q:"_______ racquets do you have?", o:optHow, c:1, t:"how", e:"'racquets' đếm được -> How many."},
            {q:"_______ milk is in the bottle?", o:optHow, c:0, t:"how", e:"'milk' không đếm được -> How much."},
            {q:"_______ time do you spend in the garden?", o:optHow, c:0, t:"how", e:"'time' không đếm được -> How much."},
            {q:"_______ students are in the classroom?", o:optHow, c:1, t:"how", e:"'students' đếm được -> How many."},
            {q:"_______ rice do you want?", o:optHow, c:0, t:"how", e:"'rice' không đếm được -> How much."},
            {q:"_______ birds are flying in the sky?", o:optHow, c:1, t:"how", e:"'birds' đếm được -> How many."},
            {q:"_______ water does the tree need?", o:optHow, c:0, t:"how", e:"'water' không đếm được -> How much."},
            {q:"_______ apples are on the table?", o:optHow, c:1, t:"how", e:"'apples' đếm được -> How many."},
            {q:"_______ money is in the wallet?", o:optHow, c:0, t:"how", e:"'money' không đếm được -> How much."},
            {q:"_______ toys does she have?", o:optHow, c:1, t:"how", e:"'toys' đếm được -> How many."},
            {q:"There is _______ yogurt in the fridge.", o:optSome, c:0, t:"some", e:"Câu khẳng định dùng some."},
            {q:"I don't have _______ red dates for the tea.", o:optSome, c:1, t:"some", e:"Câu phủ định dùng any."},
            {q:"Are there _______ flowers in the garden?", o:optSome, c:1, t:"some", e:"Câu hỏi dùng any."},
            {q:"He has _______ new books on the desk.", o:optSome, c:0, t:"some", e:"Câu khẳng định dùng some."},
            {q:"Is there _______ cheese on the plate?", o:optSome, c:1, t:"some", e:"Câu hỏi dùng any."},
            {q:"He is a boy. (Sang số nhiều)", o:["They are boys.", "We are boys.", "He are boys.", "It is boys."], c:0, t:"plu", e:"He->They, is->are, a boy->boys."},
            {q:"It is a tall tree. (Sang số nhiều)", o:["They are tall trees.", "It is tall trees.", "We are tall tree.", "Them are tall trees."], c:0, t:"plu", e:"It->They, is->are, a tall tree->tall trees."},
            {q:"She is a teacher. (Sang số nhiều)", o:["They are teachers.", "She are teachers.", "We is teachers.", "Thems are teacher."], c:0, t:"plu", e:"She->They, a teacher->teachers."},
            {q:"I am a student. (Sang số nhiều)", o:["We are students.", "They are student.", "We is student.", "I are students."], c:0, t:"plu", e:"I->We, am->are, a student->students."},
            {q:"It is a sweet apple. (Sang số nhiều)", o:["They are sweet apples.", "It are sweet apples.", "We are sweet apple.", "They is sweet apples."], c:0, t:"plu", e:"It->They, an apple->apples."}
        ],
        [ // Đề 2
            {q:"We go to bed _______ midnight.", o:optPrep, c:2, t:"prep", e:"'at midnight'."},
            {q:"The party is _______ December 25th.", o:optPrep, c:1, t:"prep", e:"Ngày tháng cụ thể dùng on."},
            {q:"I saw him _______ the afternoon.", o:optPrep, c:0, t:"prep", e:"'in the afternoon'."},
            {q:"The train arrives _______ 5:30 p.m.", o:optPrep, c:2, t:"prep", e:"Giờ dùng at."},
            {q:"My dad reads books _______ Tuesday morning.", o:optPrep, c:1, t:"prep", e:"Thứ kết hợp buổi dùng on."},
            {q:"We went to the beach _______ the weekend.", o:optPrep, c:2, t:"prep", e:"'at the weekend'."},
            {q:"The weather is very cold _______ winter.", o:optPrep, c:0, t:"prep", e:"Mùa dùng in."},
            {q:"She will call you _______ a few minutes.", o:optPrep, c:0, t:"prep", e:"Cụm 'in a few minutes'."},
            {q:"The grocery store closes _______ night.", o:optPrep, c:2, t:"prep", e:"'at night'."},
            {q:"He was born _______ 2015.", o:optPrep, c:0, t:"prep", e:"Năm dùng in."},
            {q:"_______ sugar do you put in your tea?", o:optHow, c:0, t:"how", e:"'sugar' không đếm được -> How much."},
            {q:"_______ brothers do you have?", o:optHow, c:1, t:"how", e:"'brothers' đếm được -> How many."},
            {q:"_______ homework did the teacher give?", o:optHow, c:0, t:"how", e:"'homework' không đếm được -> How much."},
            {q:"_______ chairs are in the living room?", o:optHow, c:1, t:"how", e:"'chairs' đếm được -> How many."},
            {q:"_______ juice is left in the glass?", o:optHow, c:0, t:"how", e:"'juice' không đếm được -> How much."},
            {q:"_______ cars are driving on the highway?", o:optHow, c:1, t:"how", e:"'cars' đếm được -> How many."},
            {q:"_______ advice did your father give you?", o:optHow, c:0, t:"how", e:"'advice' không đếm được -> How much."},
            {q:"_______ days are there in August?", o:optHow, c:1, t:"how", e:"'days' đếm được -> How many."},
            {q:"_______ bread is on the table?", o:optHow, c:0, t:"how", e:"'bread' không đếm được -> How much."},
            {q:"_______ friends are playing outside?", o:optHow, c:1, t:"how", e:"'friends' đếm được -> How many."},
            {q:"We need _______ avocados for breakfast.", o:optSome, c:0, t:"some", e:"Khẳng định dùng some."},
            {q:"She doesn't read _______ books in the evening.", o:optSome, c:1, t:"some", e:"Phủ định dùng any."},
            {q:"Do you have _______ free time today?", o:optSome, c:1, t:"some", e:"Câu hỏi dùng any."},
            {q:"There are _______ ducks swimming in the lake.", o:optSome, c:0, t:"some", e:"Khẳng định dùng some."},
            {q:"There isn't _______ meat in the soup.", o:optSome, c:1, t:"some", e:"Phủ định dùng any."},
            {q:"The dictionary is heavy. (Sang số nhiều)", o:["The dictionaries are heavy.", "The dictionarys are heavy.", "The dictionaries is heavy.", "The dictionary are heavy."], c:0, t:"plu", e:"y->ies (dictionaries); is->are."},
            {q:"He has a new car. (Sang số nhiều)", o:["They have new cars.", "They has new cars.", "He have new cars.", "They are new cars."], c:0, t:"plu", e:"He->They; has->have; car->cars."},
            {q:"It is a sharp knife. (Sang số nhiều)", o:["They are sharp knives.", "They are sharp knifes.", "It are sharp knives.", "They is sharp knives."], c:0, t:"plu", e:"knife đổi fe thành ves (knives)."},
            {q:"She is a happy woman. (Sang số nhiều)", o:["They are happy women.", "They are happy womans.", "She are happy women.", "They is happy women."], c:0, t:"plu", e:"woman->women."},
            {q:"It is a beautiful flower. (Sang số nhiều)", o:["They are beautiful flowers.", "It are beautiful flowers.", "They is beautiful flowers.", "We are beautiful flower."], c:0, t:"plu", e:"flower->flowers."}
        ],
        [ // Đề 3
            {q:"My uncle visited us _______ April 30th.", o:optPrep, c:1, t:"prep", e:"Ngày cụ thể dùng on."},
            {q:"We always have a big dinner _______ New Year's Eve.", o:optPrep, c:1, t:"prep", e:"Dịp lễ có chữ 'Eve' dùng on."},
            {q:"The cat is sleeping _______ the sofa.", o:optPrep, c:1, t:"prep", e:"Trên bề mặt dùng on."},
            {q:"School finishes _______ 4:30 p.m.", o:optPrep, c:2, t:"prep", e:"Mốc giờ dùng at."},
            {q:"I like to read books _______ the evening.", o:optPrep, c:0, t:"prep", e:"'in the evening'."},
            {q:"He was in Hanoi _______ 2021.", o:optPrep, c:0, t:"prep", e:"Năm dùng in."},
            {q:"They are waiting _______ the bus stop.", o:optPrep, c:2, t:"prep", e:"Trạm chờ (địa điểm nhỏ) dùng at."},
            {q:"The picture hangs _______ the wall.", o:optPrep, c:1, t:"prep", e:"Trên tường dùng on."},
            {q:"It rains a lot _______ summer.", o:optPrep, c:0, t:"prep", e:"Mùa dùng in."},
            {q:"We have English class _______ Tuesday.", o:optPrep, c:1, t:"prep", e:"Thứ dùng on."},
            {q:"_______ coffee do you drink every day?", o:optHow, c:0, t:"how", e:"'coffee' không đếm được -> How much."},
            {q:"_______ pencils are there in your pencil case?", o:optHow, c:1, t:"how", e:"'pencils' đếm được -> How many."},
            {q:"_______ information did you find on the internet?", o:optHow, c:0, t:"how", e:"'information' không đếm được -> How much."},
            {q:"_______ computers are there in the IT room?", o:optHow, c:1, t:"how", e:"'computers' đếm được -> How many."},
            {q:"_______ honey do we need for the cake?", o:optHow, c:0, t:"how", e:"'honey' không đếm được -> How much."},
            {q:"_______ trees are planted in the park?", o:optHow, c:1, t:"how", e:"'trees' đếm được -> How many."},
            {q:"_______ sand is on the beach?", o:optHow, c:0, t:"how", e:"'sand' không đếm được -> How much."},
            {q:"_______ windows does your house have?", o:optHow, c:1, t:"how", e:"'windows' đếm được -> How many."},
            {q:"_______ oil is left in the bottle?", o:optHow, c:0, t:"how", e:"'oil' không đếm được -> How much."},
            {q:"_______ pairs of socks do you want to buy?", o:optHow, c:1, t:"how", e:"'pairs' đếm được -> How many."},
            {q:"I would like _______ tea, please.", o:optSome, c:0, t:"some", e:"Lời mời lịch sự dùng some."},
            {q:"There aren't _______ oranges in the basket.", o:optSome, c:1, t:"some", e:"Phủ định dùng any."},
            {q:"Do you have _______ water?", o:optSome, c:1, t:"some", e:"Câu hỏi dùng any."},
            {q:"She doesn't have _______ pens in her bag.", o:optSome, c:1, t:"some", e:"Phủ định dùng any."},
            {q:"We need _______ butter for this recipe.", o:optSome, c:0, t:"some", e:"Khẳng định dùng some."},
            {q:"The baby is crying. (Sang số nhiều)", o:["The babies are crying.", "The babys are crying.", "The babies is crying.", "The baby are crying."], c:0, t:"plu", e:"baby->babies; is->are."},
            {q:"She is a kind person. (Sang số nhiều)", o:["They are kind people.", "They are kind persons.", "She are kind people.", "Cả A và B đều được"], c:0, t:"plu", e:"person chuyển thành people (phổ biến nhất)."},

    // 3. THUẬT TOÁN TỰ SINH 500+ CÂU HỎI KHÔNG TRÙNG LẶP (Siêu nhẹ)

                    let itm = sPool[j%sPool.length];
                    ex.push({...itm, id:j+1, q:`(${j+1}) ${itm.q}`});
                }
                allExams.push(ex);
            }
        });
    }

    function genPractice() {
        allExams = pExams.map(ex => ex.map((itm, i) => ({ ...itm, id:i+1, q:`(${i+1}) ${itm.q}` })));
    }

    function switchTab(mode) {
        curMode = mode;
        ['Mixed','Practice','Topic'].forEach(m => document.getElementById('tab'+m).classList.toggle('active', mode===m.toLowerCase()));
        let desc = document.getElementById('selectDesc');
        
        if(mode==='mixed') { desc.innerText = "Chọn đề tổng hợp bên dưới (25 câu - Phân bổ đều không trùng lặp)"; genMixed(); }
        else if(mode==='practice') { desc.innerText = "Chọn đề ôn tập thực chiến bên dưới (30 câu/đề - Theo cấu trúc chuẩn)"; genPractice(); }
        else { desc.innerText = "Chọn chuyên đề ôn luyện sâu bên dưới (25 câu/đề)"; genTopic(); }
        
        const grid = document.getElementById('examGrid'); grid.innerHTML = '';
        if(mode !== 'topic') {
            let len = mode==='mixed' ? 20 : pExams.length;
            for(let i=0; i<len; i++) {
                let b = document.createElement('button'); b.className = 'exam-btn'; 
                b.innerText = mode==='mixed' ? `Đề Tổng Hợp ${i+1} 🌟` : `Đề Ôn Tập ${i+1} 📚`;
                b.onclick = () => start(i); grid.appendChild(b);
            }
        } else {
            Object.keys(topics).forEach((k, tI) => {
                for(let s=0; s<8; s++) {
                    let b = document.createElement('button'); b.className = 'exam-btn';
                    b.innerText = `${tI+1}.${s+1} ${topics[k].name.substring(0,8)}... 🎯`;
                    b.onclick = () => start(tI*8+s); grid.appendChild(b);
                }
            });
        }
    }

    function start(idx) {
        curIdx = idx; curQIdx = 0; 
        uAns = new Array(allExams[curIdx].length).fill(null);
        let tt = "";
        if(curMode==='mixed') tt = `🚀 Đề Tổng Hợp Số ${idx+1}`;
        else if(curMode==='practice') tt = `📚 Ôn Tập Thực Chiến: Đề Số ${idx+1}`;
        else tt = `🎯 Ôn Tập Chuyên Đề ${ (idx%8)+1 }`;
        
        document.getElementById('examTitle').innerText = tt;
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-quiz').classList.add('active');
        renderQ();
    }

    function renderQ() {
        let q = allExams[curIdx][curQIdx], tot = allExams[curIdx].length;
        document.getElementById('questionCounter').innerText = `Câu ${curQIdx+1} / ${tot}`;
        document.getElementById('questionText').innerText = q.q;
        let opts = document.getElementById('optionsList'); opts.innerHTML = '';
        q.o.forEach((opt, i) => {
            let d = document.createElement('div'); 
            d.className = 'option-item ' + (uAns[curQIdx]===i ? 'selected' : '');
            d.innerText = `${String.fromCharCode(65+i)}. ${opt}`;
            d.onclick = () => { uAns[curQIdx] = i; renderQ(); }; 
            opts.appendChild(d);
        });
        document.getElementById('prevBtn').style.display = curQIdx===0 ? 'none' : 'block';
        document.getElementById('nextBtn').innerText = curQIdx===tot-1 ? 'Nộp Bài 🎯' : 'Câu tiếp theo ➡';
    }

    function confirmHome() {
        if(confirm("Bạn có muốn dừng làm bài và quay về trang chủ? Tiến trình sẽ bị hủy.")) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-select').classList.add('active');
        }
    }
    
    function returnToSelect() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-select').classList.add('active');
    }
    
    function prevQuestion() { if(curQIdx > 0) { curQIdx--; renderQ(); } }
    function nextQuestion() { if(curQIdx < allExams[curIdx].length-1) { curQIdx++; renderQ(); } else finish(); }

    function finish() {
        let sc = 0, stats = {};
        for(let k in topics) stats[k] = { w:0, n:topics[k].name, th:topics[k].theory };
        let tbody = document.getElementById('resultTableBody'); tbody.innerHTML = '';
        
        allExams[curIdx].forEach((q, i) => {
            let isC = uAns[i] === q.c; 
            if(isC) sc++; else if(stats[q.t]) stats[q.t].w++;
            
            let uT = uAns[i]!==null ? `${String.fromCharCode(65+uAns[i])}. ${q.o[uAns[i]]}` : "Chưa chọn";
            let cT = `${String.fromCharCode(65+q.c)}. ${q.o[q.c]}`;
            
            tbody.innerHTML += `<tr>
                <td><b>${i+1}</b></td>
                <td><div>${q.q}</div><div style="font-size:13px;margin-top:4px;">Bạn chọn: <span style="color:var(--${isC?'success':'danger'})">${uT}</span></div></td>
                <td>
                    <div><span class="${isC?'text-correct':'text-incorrect'}">${isC?'Đúng':'Sai'}</span></div>
                    ${!isC ? `<div style="font-size:13px; margin-top:3px;">Đáp án đúng: <b>${cT}</b></div>` : ''}
                    <div class="explanation"><b>Hướng dẫn:</b> ${q.e}</div>
                </td>
            </tr>`;
        });
        
        document.getElementById('scoreBadge').innerText = `${sc} / ${allExams[curIdx].length}`;
        let badT = null, maxW = -1;
        for(let k in stats) if(stats[k].w > maxW) { maxW = stats[k].w; badT = stats[k]; }
        
        let txt = document.getElementById('analysisText');
        if(maxW === 0) {
            txt.innerHTML = "🌟 <b>Hoàn hảo!</b> Bạn đã trả lời đúng 100%. Nền tảng ngữ pháp của bạn vô cùng tuyệt vời!";
        } else {
            txt.innerHTML = `📌 Điểm yếu cần khắc phục: <b style="color:var(--danger)">${badT.n}</b> (sai ${maxW} câu).<br>
            <div style="background:#ffffff; padding:12px; border-radius:8px; border:1px solid #fde68a; margin-top:10px; font-weight:normal;">${badT.th}</div>`;
        }
        
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-result').classList.add('active');
    }

    window.onload = () => switchTab('mixed');
</script>
</body>
</html>
