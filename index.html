<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinh Phục Tiếng Anh - Vui Học Mỗi Ngày</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; --primary-hover: #4f46e5;
            --success: #10b981; --danger: #f43f5e; --warning: #f59e0b;
            --accent: #8b5cf6; --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #fae8ff 100%);
            --card-bg: #ffffff; --text-color: #1e293b;
        }
        body {
            font-family: 'Nunito', sans-serif; background: var(--bg-gradient); color: var(--text-color);
            margin: 0; padding: 15px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;
        }
        .container {
            width: 100%; max-width: 900px; background: var(--card-bg); padding: 30px;
            border-radius: 24px; box-shadow: 0 20px 40px rgba(99, 102, 241, 0.15); border: 4px solid #ffffff; margin-top: 20px; margin-bottom: 20px;
        }
        h1, h2, h3 { color: var(--primary); text-align: center; }
        h1 { font-weight: 900; font-size: 28px; margin-bottom: 10px; line-height: 1.3; }
        
        .screen { display: none; animation: fadeIn 0.3s ease-in-out; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .tab-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 25px; flex-wrap: wrap; }
        .tab-btn {
            background: #f1f5f9; border: none; padding: 10px 16px; font-size: 15px; font-weight: 800;
            border-radius: 14px; cursor: pointer; color: #64748b; transition: all 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .tab-btn.active { background: var(--primary); color: white; transform: translateY(-2px); box-shadow: 0 8px 15px rgba(99,102,241,0.3); }
        .tab-btn.theory-active { background: var(--accent); color: white; box-shadow: 0 8px 15px rgba(139,92,246,0.3); }

        .history-btn-wrapper { text-align: center; margin-bottom: 20px; }
        .btn-history {
            background: #fff; color: var(--primary); border: 2px solid var(--primary); padding: 8px 20px;
            font-size: 15px; font-weight: 800; border-radius: 12px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 10px rgba(99,102,241,0.1);
        }
        .btn-history:hover { background: var(--primary); color: #fff; transform: translateY(-2px); }

        /* Style Lưới Chọn Bài */
        .exam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 10px; max-height: 400px; overflow-y: auto; padding: 8px; }
        .exam-btn {
            background: linear-gradient(135deg, #e0e7ff 0%, #ede9fe 100%); color: var(--primary); border: 2px solid #c7d2fe;
            padding: 14px; font-size: 15px; font-weight: 800; border-radius: 16px; cursor: pointer; transition: all 0.2s ease; text-align: center;
        }
        .exam-btn:hover { background: var(--primary); color: white; transform: translateY(-3px); box-shadow: 0 6px 15px rgba(99,102,241,0.3); }
        
        /* Style Giao Diện Làm Bài */
        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; }
        .home-btn { background: #f1f5f9; color: #475569; border: none; padding: 8px 14px; border-radius: 10px; font-weight: 800; cursor: pointer; transition: all 0.2s; }
        .home-btn:hover { background: #e2e8f0; color: #1e293b; }
        
        .question-box { font-size: 19px; font-weight: 800; margin-bottom: 25px; line-height: 1.5; background: #f8fafc; padding: 20px; border-radius: 16px; border-left: 6px solid var(--primary); }
        .options-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
        .option-item { background: #ffffff; border: 2px solid #e2e8f0; padding: 14px 18px; border-radius: 14px; cursor: pointer; font-size: 17px; font-weight: 700; transition: all 0.2s ease; }
        .option-item:hover { background: #f8fafc; transform: translateX(4px); border-color: #cbd5e1;}
        .option-item.selected { background: #eef2ff; border-color: var(--primary); color: var(--primary); box-shadow: 0 4px 12px rgba(99,102,241,0.15); }
        
        .quiz-footer { display: flex; justify-content: space-between; align-items: center; }
        button.btn { background: var(--primary); color: white; border: none; padding: 12px 26px; font-size: 16px; font-weight: 800; border-radius: 14px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(99,102,241,0.3); }
        button.btn:hover { background: var(--primary-hover); transform: translateY(-2px); }
        button.btn-secondary { background: #cbd5e1; color: #475569; box-shadow: none; }
        button.btn-secondary:hover { background: #94a3b8; }
        
        /* Style Giao Diện Lý Thuyết (Mới) */
        .theory-card { background: #fff; border: 2px solid #eef2ff; border-radius: 16px; margin-bottom: 20px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .theory-card h3 { color: var(--accent); margin-top: 0; text-align: left; font-size: 22px; border-bottom: 2px dashed #e0e7ff; padding-bottom: 10px; margin-bottom: 20px;}
        .theory-rule { background: #f8fafc; padding: 15px; border-left: 6px solid var(--primary); border-radius: 10px; margin-bottom: 15px; line-height: 1.6; font-size: 16px;}
        .theory-rule b { color: #1e293b; font-size: 17px;}
        
        /* Style Ô Thực Hành Nhúng */
        .prac-container { background: #eef2ff; padding: 18px; border-radius: 12px; margin-top: 10px; font-weight: 700; color: #1e293b; border: 2px dashed #c7d2fe; display: flex; flex-direction: column; gap: 10px;}
        .prac-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
        .prac-input { border: 2px solid #cbd5e1; padding: 8px 12px; border-radius: 10px; font-size: 16px; font-weight: 800; width: 140px; outline: none; transition: all 0.2s; text-align: center; color: #334155; }
        .prac-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.2); }
        .prac-select { border: 2px solid #cbd5e1; padding: 8px 12px; border-radius: 10px; font-size: 16px; font-weight: 800; outline: none; transition: all 0.2s; cursor: pointer; color: #334155;}
        .prac-select:focus { border-color: var(--primary); }
        
        /* Style Bảng Điểm & Lịch Sử */
        .score-badge { font-size: 46px; font-weight: 900; color: var(--success); margin: 10px 0; text-align: center; text-shadow: 0 4px 10px rgba(16,185,129,0.2);}
        .analysis-box { background: #fffbeb; border-left: 6px solid var(--warning); padding: 20px; margin-bottom: 25px; border-radius: 12px; }
        .detail-table-container { max-height: 400px; overflow-y: auto; border: 2px solid #f1f5f9; border-radius: 16px; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 14px; border-bottom: 1px solid #f1f5f9; font-size: 15px; }
        th { background: #f8fafc; position: sticky; top: 0; font-weight: 800; color: #475569;}
        .text-correct { color: var(--success); font-weight: 800; }
        .text-incorrect { color: var(--danger); font-weight: 800; }
        .explanation { font-size: 14px; color: #475569; margin-top: 6px; background: #f8fafc; padding: 10px; border-radius: 8px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <!-- MÀN HÌNH 1: TRANG CHỦ -->
    <div id="screen-select" class="screen active">
        <h1>🚀 Chinh Phục Tiếng Anh Vui Nhộn 🌟</h1>
        
        <div class="tab-container">
            <button class="tab-btn active" id="tabMixed" onclick="switchTab('mixed')">🔥 20 Đề Tổng Hợp</button>
            <button class="tab-btn" id="tabPractice" onclick="switchTab('practice')">📚 7 Đề Ôn Tập</button>
            <button class="tab-btn" id="tabTopic" onclick="switchTab('topic')">🎯 8 Đề Chuyên Đề</button>
            <button class="tab-btn" id="tabTheory" onclick="switchTab('theory')">📖 Lý Thuyết & Thực Hành</button>
        </div>
        
        <div class="history-btn-wrapper" id="historyWrapper">
            <button class="btn-history" onclick="showHistory()">📜 Xem Lịch Sử Học Tập</button>
        </div>

        <p style="text-align: center; color: #64748b; font-weight: 700; font-size: 16px;" id="selectDesc">Đang tải dữ liệu...</p>
        <div class="exam-grid" id="examGrid"></div>
    </div>

    <!-- MÀN HÌNH 2: LÀM BÀI THI -->
    <div id="screen-quiz" class="screen">
        <div class="quiz-header">
            <button class="home-btn" onclick="confirmHome()">🏠 Trang Chủ</button>
            <span id="examTitle" style="font-weight: 800; color: var(--primary); font-size: 18px;">Đề thi</span>
            <span id="questionCounter" style="font-weight: 800; background: #eef2ff; color: var(--primary); padding: 8px 16px; border-radius: 12px;">Câu 1</span>
        </div>
        <div class="question-box" id="questionText"></div>
        <div class="options-list" id="optionsList"></div>
        <div class="quiz-footer">
            <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()">⬅ Quay lại</button>
            <button class="btn" id="nextBtn" onclick="nextQuestion()">Câu tiếp ➡</button>
        </div>
    </div>

    <!-- MÀN HÌNH 3: BÀI GIẢNG LÝ THUYẾT CHI TIẾT -->
    <div id="screen-theory" class="screen">
        <div class="quiz-header">
            <button class="home-btn" onclick="returnToSelect()">🏠 Quay Lại Menu</button>
            <span style="font-weight: 800; color: var(--accent); font-size: 20px;">📖 Hệ Thống Lý Thuyết Tương Tác</span>
        </div>
        
        <div style="max-height: 650px; overflow-y: auto; padding-right: 10px;" id="theoryContentArea">
            <!-- Nội dung bài giảng sẽ được đổ vào đây bằng Javascript -->
        </div>
    </div>

    <!-- MÀN HÌNH 4: KẾT QUẢ -->
    <div id="screen-result" class="screen">
        <h2>🎉 Hoàn Thành Xuất Sắc! 🎉</h2>
        <div class="score-badge" id="scoreBadge"></div>
        <div class="analysis-box" id="analysisBox">
            <h3 style="color: #d97706; margin-top:0;">📊 Phân tích & Hướng dẫn:</h3>
            <div id="analysisText" style="line-height: 1.6; font-weight: 700; font-size: 15px;"></div>
        </div>
        <h3 style="text-align: left; margin-bottom: 10px;">📝 Bảng chi tiết đáp án</h3>
        <div class="detail-table-container">
            <table>
                <thead><tr><th style="width:8%;">Câu</th><th style="width:42%;">Câu hỏi & Đáp án</th><th style="width:50%;">Kết quả & Giải thích</th></tr></thead>
                <tbody id="resultTableBody"></tbody>
            </table>
        </div>
        <div style="text-align: center;"><button class="btn" onclick="returnToSelect()">🏠 Trang Chủ</button></div>
    </div>

    <!-- MÀN HÌNH 5: LỊCH SỬ -->
    <div id="screen-history" class="screen">
        <h2>📜 Lịch Sử Học Tập Của Bạn</h2>
        <div class="detail-table-container">
            <table>
                <thead><tr><th style="width:30%;">⏰ Thời Gian</th><th style="width:50%;">📝 Tên Đề Thi</th><th style="width:20%;">🎯 Điểm</th></tr></thead>
                <tbody id="historyTableBody"></tbody>
            </table>
        </div>
        <div style="display: flex; justify-content: center; gap: 15px;">
            <button class="btn btn-secondary" onclick="returnToSelect()">🏠 Trang Chủ</button>
            <button class="btn" style="background: var(--danger);" onclick="clearHistory()">🗑 Xóa Lịch Sử</button>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // PHẦN 1: KHAI BÁO DỮ LIỆU & LÝ THUYẾT CHI TIẾT
    // ==========================================
    const topics = {
        prep: { name: "Giới từ thời gian", theory: "IN: tháng, năm, mùa, buổi. ON: thứ, ngày tháng. AT: giờ, đêm, lễ." },
        how: { name: "How much / How many", theory: "HOW MANY: đếm được số nhiều. HOW MUCH: không đếm được / Giá tiền." },
        some: { name: "Some & Any", theory: "SOME: khẳng định, mời. ANY: phủ định, câu hỏi." },

        obj: { name: "Đại từ tân ngữ", theory: "Đứng sau Động từ/Giới từ: I->me, he->him, she->her, we->us, they->them." },
        be: { name: "Động từ To be", theory: "I am; He/She/It is; We/You/They are." },
        wh: { name: "Từ để hỏi (Wh-q)", theory: "What, Who, Where, When, Why, How." }
    };

    // Chuỗi HTML chứa toàn bộ hệ thống Lý Thuyết & Thực hành Interactive
    const fullTheoryHTML = `
        <div class="theory-card">
            <h3>1. Danh từ Số Ít & Số Nhiều (Singular & Plural)</h3>
            <div class="theory-rule">

            <div class="prac-container">
                <div class="prac-row">✏️ a cat ➔ <input type="text" class="prac-input" data-ans="cats" onkeyup="checkPracInput(this)" placeholder="gõ vào đây..."></div>
                <div class="prac-row">✏️ a dog ➔ <input type="text" class="prac-input" data-ans="dogs" onkeyup="checkPracInput(this)"></div>

            <div class="theory-rule" style="margin-top:20px;">
                <b>Quy tắc 2: Tận cùng là O, S, CH, X, SH ➔ Thêm "-es"</b><br>
                <i>(Mẹo nhớ vui: Ông Sáu Chạy Xe SH)</i><br>
                Ví dụ: bus ➔ buses, watch ➔ watches, box ➔ boxes, potato ➔ potatoes.
            </div>
            <div class="prac-container">
                <div class="prac-row">✏️ a tomato (cà chua) ➔ <input type="text" class="prac-input" data-ans="tomatoes" onkeyup="checkPracInput(this)"></div>
                <div class="prac-row">✏️ a brush (cái cọ) ➔ <input type="text" class="prac-input" data-ans="brushes" onkeyup="checkPracInput(this)"></div>
            </div>

            <div class="theory-rule" style="margin-top:20px;">
                <b>Quy tắc 3: Tận cùng là Phụ âm + "Y" ➔ Đổi "y" thành "i" và thêm "-es"</b><br>
                Ví dụ: baby ➔ babies, city ➔ cities.<br>
                <i>Chú ý: Nếu trước y là nguyên âm (u,e,o,a,i) thì chỉ thêm s: boy ➔ boys.</i>
            </div>
            <div class="prac-container">
                <div class="prac-row">✏️ a ladybug (con bọ rùa) ➔ <input type="text" class="prac-input" data-ans="ladybugs" onkeyup="checkPracInput(this)"></div>
                <div class="prac-row">✏️ a story (câu chuyện) ➔ <input type="text" class="prac-input" data-ans="stories" onkeyup="checkPracInput(this)"></div>
            </div>

            <div class="theory-rule" style="margin-top:20px;">
                <b>Quy tắc 4: Tận cùng là "F" hoặc "FE" ➔ Đổi thành "-ves"</b><br>
                Ví dụ: leaf (chiếc lá) ➔ leaves, knife (con dao) ➔ knives, wife ➔ wives.
            </div>
            <div class="prac-container">
                <div class="prac-row">✏️ a wolf (chó sói) ➔ <input type="text" class="prac-input" data-ans="wolves" onkeyup="checkPracInput(this)"></div>
            </div>

            <div class="theory-rule" style="margin-top:20px;">
                <b>Quy tắc 5: Bất Quy Tắc (Phải học thuộc)</b><br>
                • man ➔ men (đàn ông)<br>• woman ➔ women (phụ nữ)<br>• child ➔ children (trẻ em)<br>
                • foot ➔ feet (bàn chân)<br>• tooth ➔ teeth (răng)<br>• mouse ➔ mice (chuột)<br>
                • sheep ➔ sheep (con cừu - giữ nguyên)<br>• fish ➔ fish (con cá - giữ nguyên)
            </div>
            <div class="prac-container">
                <div class="prac-row">✏️ a child ➔ <input type="text" class="prac-input" data-ans="children" onkeyup="checkPracInput(this)"></div>
                <div class="prac-row">✏️ a foot ➔ <input type="text" class="prac-input" data-ans="feet" onkeyup="checkPracInput(this)"></div>
            </div>
        </div>

        <div class="theory-card">
            <h3>2. Đại Từ Nhân Xưng & Tân Ngữ (Pronouns)</h3>
            <div class="theory-rule">
                • <b>Chủ ngữ (Subject):</b> I, You, He, She, It, We, They. (Luôn đứng ĐẦU câu / trước động từ).<br>

            </div>
            <div class="prac-container">
                <div class="prac-row">

                    <select class="prac-select" data-ans="her" onchange="checkPracSelect(this)">

                <div class="prac-row">

                        <option value="">--Chọn--</option><option value="he">he</option><option value="him">him</option><option value="his">his</option>
                    </select>!
                </div>
            </div>
        </div>

        <div class="theory-card">
            <h3>3. Giới từ chỉ Thời Gian (In / On / At)</h3>
            <div class="theory-rule">
                • <b>IN:</b> Đi với <i>Tháng, Năm, Mùa, Buổi trong ngày</i> (in 2025, in June, in summer, in the morning).<br>
                • <b>ON:</b> Đi với <i>Thứ trong tuần, Ngày tháng cụ thể</i> (on Monday, on May 5th, on Sunday morning).<br>
                • <b>AT:</b> Đi với <i>Giờ cụ thể, Các dịp lễ, Đêm/Trưa</i> (at 7 o'clock, at Christmas, at night, at noon).
            </div>
            <div class="prac-container">
                <div class="prac-row">✏️ I wake up <input type="text" class="prac-input" data-ans="at" onkeyup="checkPracInput(this)"> 6 o'clock.</div>
                <div class="prac-row">✏️ We don't go to school <input type="text" class="prac-input" data-ans="on" onkeyup="checkPracInput(this)"> Sundays.</div>
                <div class="prac-row">✏️ It is very cold <input type="text" class="prac-input" data-ans="in" onkeyup="checkPracInput(this)"> winter.</div>
            </div>
        </div>

        <div class="theory-card">
            <h3>4. Some & Any (Một vài / Một ít)</h3>
            <div class="theory-rule">
                • <b>SOME:</b> Dùng trong câu <i>Khẳng định</i> và câu <i>Mời / Đề nghị lịch sự</i>.<br>
                • <b>ANY:</b> Dùng trong câu <i>Phủ định</i> (có not, don't, isn't) và câu <i>Hỏi nghi vấn</i>.
            </div>
            <div class="prac-container">
                <div class="prac-row">
                    I don't have 
                    <select class="prac-select" data-ans="any" onchange="checkPracSelect(this)">
                        <option value="">--Chọn--</option><option value="some">some</option><option value="any">any</option>
                    </select> pens.
                </div>
                <div class="prac-row">
                    Would you like 
                    <select class="prac-select" data-ans="some" onchange="checkPracSelect(this)">
                        <option value="">--Chọn--</option><option value="some">some</option><option value="any">any</option>
                    </select> milk?
                </div>
            </div>
        </div>

        <div class="theory-card">
            <h3>5. How much & How many (Hỏi số lượng)</h3>
            <div class="theory-rule">
                • <b>HOW MANY:</b> + Danh từ đếm được SỐ NHIỀU (thường có "s"). <i>Ví dụ: How many books do you have?</i><br>
                • <b>HOW MUCH:</b> + Danh từ KHÔNG đếm được (nước, tiền, thời gian...) hoặc dùng để hỏi Giá Tiền. <i>Ví dụ: How much water is left?</i>
            </div>
            <div class="prac-container">
                <div class="prac-row">
                    <select class="prac-select" data-ans="How much" onchange="checkPracSelect(this)">
                        <option value="">--Chọn--</option><option value="How much">How much</option><option value="How many">How many</option>
                    </select> money do you have?
                </div>
                <div class="prac-row">
                    <select class="prac-select" data-ans="How many" onchange="checkPracSelect(this)">
                        <option value="">--Chọn--</option><option value="How much">How much</option><option value="How many">How many</option>
                    </select> students are there?
                </div>
            </div>
        </div>
    `;

    // Khai báo dữ liệu các mảng (rút gọn)
    const optPrep = ["in", "on", "at", "by"];
    const optHow = ["How much", "How many", "What", "Which"];
    const optSome = ["some", "any", "a", "an"];

            {q:"She hasn't got _______ brothers.", o:optSome, c:1, t:"some", e:"Phủ định dùng any."},
            {q:"There is _______ water on the floor.", o:optSome, c:0, t:"some", e:"Khẳng định dùng some."},
            {q:"Are there _______ messages for me?", o:optSome, c:1, t:"some", e:"Câu hỏi dùng any."},
            {q:"The child is happy. (Sang số nhiều)", o:["The children are happy.", "The childs are happy.", "The children is happy.", "The child are happy."], c:0, t:"plu", e:"child->children."},
            {q:"It is a long dictionary. (Sang số nhiều)", o:["They are long dictionaries.", "They are long dictionarys.", "It are long dictionaries.", "They is long dictionaries."], c:0, t:"plu", e:"dictionary->dictionaries."},
            {q:"He is a brave policeman. (Sang số nhiều)", o:["They are brave policemen.", "They are brave policemans.", "He are brave policemen.", "They is brave policemen."], c:0, t:"plu", e:"policeman->policemen."},
            {q:"The glass is empty. (Sang số nhiều)", o:["The glasses are empty.", "The glasss are empty.", "The glasses is empty.", "The glass are empty."], c:0, t:"plu", e:"glass->glasses."},
            {q:"She has a white goose. (Sang số nhiều)", o:["They have white geese.", "They has white gooses.", "She have white geese.", "They are white geese."], c:0, t:"plu", e:"goose->geese."}
        ],
        [ // Đề 7
            {q:"I usually wake up _______ sunrise.", o:optPrep, c:2, t:"prep", e:"Mốc rạng sáng dùng at."},
            {q:"We have a test _______ November 20th.", o:optPrep, c:1, t:"prep", e:"Ngày tháng cụ thể dùng on."},
            {q:"The shop opens _______ 8:00 a.m.", o:optPrep, c:2, t:"prep", e:"Giờ dùng at."},
            {q:"They got married _______ 2005.", o:optPrep, c:0, t:"prep", e:"Năm dùng in."},
            {q:"He plays tennis _______ Saturday afternoon.", o:optPrep, c:1, t:"prep", e:"Thứ kết hợp buổi dùng on."},
            {q:"Look at the birds _______ the sky.", o:optPrep, c:0, t:"prep", e:"Không gian bầu trời dùng in."},
            {q:"The toys are _______ the box.", o:optPrep, c:0, t:"prep", e:"Trong hộp dùng in."},
            {q:"He works _______ an office.", o:optPrep, c:0, t:"prep", e:"Văn phòng dùng in."},
            {q:"We go skiing _______ winter.", o:optPrep, c:0, t:"prep", e:"Mùa dùng in."},
            {q:"The party is _______ Thursday.", o:optPrep, c:1, t:"prep", e:"Thứ dùng on."},
            {q:"_______ homework do you have tonight?", o:optHow, c:0, t:"how", e:"homework không đếm được."},
            {q:"_______ mistakes did you make?", o:optHow, c:1, t:"how", e:"mistakes đếm được."},
            {q:"_______ time is left?", o:optHow, c:0, t:"how", e:"time không đếm được."},
            {q:"_______ pages are in this book?", o:optHow, c:1, t:"how", e:"pages đếm được."},
            {q:"_______ music do you listen to?", o:optHow, c:0, t:"how", e:"music không đếm được."},
            {q:"_______ songs are on your phone?", o:optHow, c:1, t:"how", e:"songs đếm được."},
            {q:"_______ bread did you buy?", o:optHow, c:0, t:"how", e:"bread không đếm được."},
            {q:"_______ sandwiches do we need?", o:optHow, c:1, t:"how", e:"sandwiches đếm được."},
            {q:"_______ juice is in the carton?", o:optHow, c:0, t:"how", e:"juice không đếm được."},
            {q:"_______ cups of tea did you drink?", o:optHow, c:1, t:"how", e:"cups (cốc) đếm được."},
            {q:"Let's listen to _______ music.", o:optSome, c:0, t:"some", e:"Khẳng định dùng some."},
            {q:"I can't see _______ clouds in the sky.", o:optSome, c:1, t:"some", e:"Phủ định dùng any."},
            {q:"Do you need _______ help with your homework?", o:optSome, c:1, t:"some", e:"Câu hỏi dùng any."},
            {q:"There are _______ beautiful flowers here.", o:optSome, c:0, t:"some", e:"Khẳng định dùng some."},
            {q:"We didn't take _______ photos.", o:optSome, c:1, t:"some", e:"Phủ định dùng any."},
            {q:"The foot is big. (Sang số nhiều)", o:["The feet are big.", "The foots are big.", "The feet is big.", "The foot are big."], c:0, t:"plu", e:"foot->feet."},
            {q:"It is a wild deer. (Sang số nhiều)", o:["They are wild deer.", "They are wild deers.", "It are wild deer.", "They is wild deer."], c:0, t:"plu", e:"deer giữ nguyên dạng."},
            {q:"She is a famous actress. (Sang số nhiều)", o:["They are famous actresses.", "They are famous actresss.", "She are famous actresses.", "They is famous actresses."], c:0, t:"plu", e:"actress->actresses."},
            {q:"The class is noisy. (Sang số nhiều)", o:["The classes are noisy.", "The classs are noisy.", "The classes is noisy.", "The class are noisy."], c:0, t:"plu", e:"class->classes."},
            {q:"It is a delicious strawberry. (Sang số nhiều)", o:["They are delicious strawberries.", "They are delicious strawberrys.", "It are delicious strawberries.", "They is delicious strawberries."], c:0, t:"plu", e:"strawberry->strawberries."}
        ]
    ];

    const qBank = { prep:[], how:[], some:[], plu:[], obj:[], be:[], wh:[] };
    
    // Tự sinh dữ liệu ngẫu nhiên cho kho hỗn hợp
    const prepWords = [{w:"Monday",c:1},{w:"2025",c:0},{w:"7:00 AM",c:2},{w:"the weekend",c:2},{w:"October",c:0},{w:"the morning",c:0},{w:"night",c:2},{w:"Sunday",c:1},{w:"spring",c:0},{w:"noon",c:2}];
    const prepSents = ["I will go there", "She arrives", "The class starts", "We play games", "My father works"];
    for(let i=0; i<40; i++) {
        let w = prepWords[i%prepWords.length], s = prepSents[i%prepSents.length];
        qBank.prep.push({q:`${s} _______ ${w.w}.`, o:optPrep, c:w.c, t:"prep", e:"Áp dụng quy tắc In/On/At."});
    }

    const howWords = [{w:"apples",c:1},{w:"water",c:0},{w:"money",c:0},{w:"students",c:1},{w:"sugar",c:0}];
    const howSents = ["do you have?", "do you need?", "are there?"];
    for(let i=0; i<40; i++) {
        let hw = howWords[i%howWords.length], hs = howSents[i%howSents.length];
        qBank.how.push({q:`_______ ${hw.w} ${hs}`, o:optHow, c:hw.c, t:"how", e:`'${hw.w}' ${hw.c===1?'đếm được':'không đếm được'}.`});
    }

    const someWords = ["apples", "water", "books", "money"];
    const someSents = [{s:"I have",c:0},{s:"Do you have",c:1},{s:"There isn't",c:1},{s:"Would you like",c:0}];
    for(let i=0; i<40; i++) {
        let sw = someWords[i%someWords.length], ss = someSents[i%someSents.length];
        qBank.some.push({q:`${ss.s} _______ ${sw}.`, o:optSome, c:ss.c, t:"some", e:ss.c===0?'Khẳng định/mời dùng some.':'Phủ định/hỏi dùng any.'});
    }

    const pluWords = [{s:"cat",p:"cats"},{s:"box",p:"boxes"},{s:"child",p:"children"},{s:"man",p:"men"},{s:"tooth",p:"teeth"}];
    for(let i=0; i<40; i++) {
        let pw = pluWords[i%pluWords.length];
        qBank.plu.push({q:`Chuyển sang số nhiều: a ${pw.s}`, o:[`${pw.p}`, `a ${pw.p}`, `${pw.s}s`, `many ${pw.s}`], c:0, t:"plu", e:`Số nhiều của '${pw.s}' là '${pw.p}'.`});
    }

    const objPairs = [{s:"Mary",c:3,o:["he","him","his","her"]},{s:"Tom",c:1,o:["he","him","his","her"]},{s:"my friends",c:2,o:["they","their","them","us"]}];
    for(let i=0; i<40; i++) {
        let op = objPairs[i%objPairs.length];
        qBank.obj.push({q:`Please help _______. (${op.s})`, o:op.o, c:op.c, t:"obj", e:`Tân ngữ cho '${op.s}'.`});
    }

    const beSubj = [{s:"I",c:0},{s:"He",c:1},{s:"She",c:1},{s:"We",c:2},{s:"They",c:2}];
    for(let i=0; i<40; i++) {
        let bs = beSubj[i%beSubj.length];
        qBank.be.push({q:`${bs.s} _______ happy.`, o:["am","is","are","be"], c:bs.c, t:"be", e:`'${bs.s}' dùng to be tương ứng.`});
    }

    const whData = [{a:"What",q:"_______ is your name?"},{a:"How",q:"_______ old are you?"},{a:"Where",q:"_______ do you live?"},{a:"When",q:"_______ is your birthday?"}];
    for(let i=0; i<40; i++) {
        let wd = whData[i%whData.length];
        let opts = ["What","Who","Where","When","Why","How"].sort(()=>0.5-Math.random()).slice(0,3);
        if(!opts.includes(wd.a)) opts[0] = wd.a;
        opts.push("Do"); opts = opts.sort(()=>0.5-Math.random());
        qBank.wh.push({q:wd.q, o:opts, c:opts.indexOf(wd.a), t:"wh", e:"Chọn từ để hỏi phù hợp ngữ cảnh."});
    }

    // ==========================================
    // PHẦN 2: THUẬT TOÁN ĐIỀU HƯỚNG & LÀM BÀI
    // ==========================================
    let allExams = [], curIdx = 0, curQIdx = 0, uAns = [], curMode = 'mixed';
    const shuffle = a => [...a].sort(()=>0.5-Math.random());

    function genMixed() {
        allExams = []; let keys = Object.keys(qBank);
        let counts = { plu:4, obj:4, be:4, wh:4, prep:3, some:3, how:3 };
        for(let i=0; i<20; i++){
            let ex = [];
            keys.forEach(k => {
                let pool = shuffle(qBank[k]);
                pool.slice(0, counts[k]).forEach(item => ex.push({...item}));
            });
            allExams.push(shuffle(ex).map((itm, i)=>({ ...itm, id:i+1, q:`(${i+1}) ${itm.q}` })));
        }
    }

    function genTopic() {
        allExams = [];
        Object.keys(qBank).forEach(k => {
            let pool = qBank[k];
            for(let i=0; i<8; i++){
                let sPool = shuffle(pool);
                let ex = [];
                for(let j=0; j<25; j++) {
                    let itm = sPool[j%sPool.length];
                    ex.push({...itm, id:j+1, q:`(${j+1}) ${itm.q}`});
                }
                allExams.push(ex);
            }
        });
    }

    function genPractice() {
        allExams = pExams.map(ex => ex.map((itm, i) => ({ ...itm, id:i+1, q:`(${i+1}) ${itm.q}` })));
    }

    function switchTab(mode) {
        curMode = mode;
        ['Mixed','Practice','Topic','Theory'].forEach(m => {
            let btn = document.getElementById('tab'+m);
            if(btn) btn.classList.remove('active', 'theory-active');
        });
        
        if(mode === 'theory') {
            document.getElementById('tabTheory').classList.add('theory-active');
            document.getElementById('selectDesc').style.display = 'none';
            document.getElementById('examGrid').style.display = 'none';
            document.getElementById('historyWrapper').style.display = 'none';
            
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-theory').classList.add('active');
            document.getElementById('theoryContentArea').innerHTML = fullTheoryHTML;
            return;
        }

        document.getElementById('tab'+ (mode.charAt(0).toUpperCase() + mode.slice(1))).classList.add('active');
        document.getElementById('selectDesc').style.display = 'block';
        document.getElementById('examGrid').style.display = 'grid';
        document.getElementById('historyWrapper').style.display = 'block';
        
        let desc = document.getElementById('selectDesc');
        if(mode==='mixed') { desc.innerText = "Chọn đề tổng hợp bên dưới (25 câu - Phân bổ đều không trùng lặp)"; genMixed(); }
        else if(mode==='practice') { desc.innerText = "Chọn đề ôn tập thực chiến bên dưới (30 câu/đề)"; genPractice(); }
        else { desc.innerText = "Chọn chuyên đề ôn luyện sâu bên dưới (25 câu/đề)"; genTopic(); }
        
        const grid = document.getElementById('examGrid'); grid.innerHTML = '';
        if(mode !== 'topic') {
            let len = mode==='mixed' ? 20 : pExams.length;
            for(let i=0; i<len; i++) {
                let b = document.createElement('button'); b.className = 'exam-btn'; 
                b.innerText = mode==='mixed' ? `Đề Tổng Hợp ${i+1} 🌟` : `Đề Ôn Tập ${i+1} 📚`;
                b.onclick = () => start(i); grid.appendChild(b);
            }
        } else {
            Object.keys(topics).forEach((k, tI) => {
                for(let s=0; s<8; s++) {
                    let b = document.createElement('button'); b.className = 'exam-btn';
                    b.innerText = `${tI+1}.${s+1} ${topics[k].name.substring(0,10)}... 🎯`;
                    b.onclick = () => start(tI*8+s); grid.appendChild(b);
                }
            });
        }
    }

    function start(idx) {
        curIdx = idx; curQIdx = 0; 
        uAns = new Array(allExams[curIdx].length).fill(null);
        let tt = "";
        if(curMode==='mixed') tt = `🚀 Đề Tổng Hợp Số ${idx+1}`;
        else if(curMode==='practice') tt = `📚 Ôn Tập Thực Chiến: Đề Số ${idx+1}`;
        else tt = `🎯 Ôn Tập Chuyên Đề ${ (idx%8)+1 }`;
        
        document.getElementById('examTitle').innerText = tt;
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-quiz').classList.add('active');
        renderQ();
    }

    function renderQ() {
        let q = allExams[curIdx][curQIdx], tot = allExams[curIdx].length;
        document.getElementById('questionCounter').innerText = `Câu ${curQIdx+1} / ${tot}`;
        document.getElementById('questionText').innerText = q.q;
        let opts = document.getElementById('optionsList'); opts.innerHTML = '';
        q.o.forEach((opt, i) => {
            let d = document.createElement('div'); 
            d.className = 'option-item ' + (uAns[curQIdx]===i ? 'selected' : '');
            d.innerText = `${String.fromCharCode(65+i)}. ${opt}`;
            d.onclick = () => { uAns[curQIdx] = i; renderQ(); }; 
            opts.appendChild(d);
        });
        document.getElementById('prevBtn').style.display = curQIdx===0 ? 'none' : 'block';
        document.getElementById('nextBtn').innerText = curQIdx===tot-1 ? 'Nộp Bài 🎯' : 'Câu tiếp theo ➡';
    }

    function confirmHome() {
        if(confirm("Bạn có muốn dừng làm bài và quay về trang chủ? Tiến trình sẽ bị hủy.")) {
            returnToSelect();
        }
    }
    
    function returnToSelect() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-select').classList.add('active');
        switchTab('mixed'); // Reset tab về mặc định
    }
    
    function prevQuestion() { if(curQIdx > 0) { curQIdx--; renderQ(); } }
    function nextQuestion() { if(curQIdx < allExams[curIdx].length-1) { curQIdx++; renderQ(); } else finish(); }

    // ==========================================
    // PHẦN 3: LỊCH SỬ & CHẤM ĐIỂM
    // ==========================================
    function saveHistory(examName, score, total) {
        let history = JSON.parse(localStorage.getItem('quizHistory2') || '[]');
        let date = new Date();
        let dateStr = date.toLocaleDateString('vi-VN') + ' ' + date.toLocaleTimeString('vi-VN');
        history.unshift({ date: dateStr, exam: examName, score: score, total: total });
        if(history.length > 50) history.pop();
        localStorage.setItem('quizHistory2', JSON.stringify(history));
    }

    function showHistory() {
        let history = JSON.parse(localStorage.getItem('quizHistory2') || '[]');
        let tbody = document.getElementById('historyTableBody');
        tbody.innerHTML = '';
        if(history.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding: 20px; color: #64748b;">Bạn chưa làm bài thi nào. Hãy thử sức ngay nhé!</td></tr>';
        } else {
            history.forEach(h => {
                tbody.innerHTML += `<tr>
                    <td style="color: #64748b;">${h.date}</td>
                    <td style="font-weight: 800; color: var(--primary);">${h.exam}</td>
                    <td><b><span class="text-correct">${h.score}</span> / ${h.total}</b></td>
                </tr>`;
            });
        }
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-history').classList.add('active');
    }

    function clearHistory() {
        if(confirm('Bạn có chắc chắn muốn xóa toàn bộ lịch sử học tập?')) {
            localStorage.removeItem('quizHistory2');
            showHistory();
        }
    }

    function finish() {
        let sc = 0, stats = {};
        for(let k in topics) stats[k] = { w:0, n:topics[k].name, theory:topics[k].theory };
        let tbody = document.getElementById('resultTableBody'); tbody.innerHTML = '';
        
        allExams[curIdx].forEach((q, i) => {
            let isC = uAns[i] === q.c; 
            if(isC) sc++; else if(stats[q.t]) stats[q.t].w++;
            
            let uT = uAns[i]!==null ? `${String.fromCharCode(65+uAns[i])}. ${q.o[uAns[i]]}` : "Chưa chọn";
            let cT = `${String.fromCharCode(65+q.c)}. ${q.o[q.c]}`;
            
            tbody.innerHTML += `<tr>
                <td><b>${i+1}</b></td>
                <td><div>${q.q}</div><div style="font-size:13px;margin-top:4px;">Bạn chọn: <span style="color:var(--${isC?'success':'danger'})">${uT}</span></div></td>
                <td>
                    <div><span class="${isC?'text-correct':'text-incorrect'}">${isC?'Đúng':'Sai'}</span></div>
                    ${!isC ? `<div style="font-size:13px; margin-top:3px;">Đáp án đúng: <b>${cT}</b></div>` : ''}
                    <div class="explanation"><b>Hướng dẫn:</b> ${q.e}</div>
                </td>
            </tr>`;
        });
        
        let totalQ = allExams[curIdx].length;
        document.getElementById('scoreBadge').innerText = `${sc} / ${totalQ}`;
        
        let examName = document.getElementById('examTitle').innerText.replace('🚀 ', '').replace('📚 ', '').replace('🎯 ', '');
        saveHistory(examName, sc, totalQ);

        let badT = null, maxW = -1;
        for(let k in stats) if(stats[k].w > maxW) { maxW = stats[k].w; badT = stats[k]; }
        
        let txt = document.getElementById('analysisText');
        if(maxW === 0) {
            txt.innerHTML = "🌟 <b>Hoàn hảo!</b> Bạn đã trả lời đúng 100%. Nền tảng ngữ pháp của bạn vô cùng tuyệt vời!";
        } else {
            txt.innerHTML = `📌 Điểm yếu cần khắc phục: <b style="color:var(--danger)">${badT.n}</b> (sai ${maxW} câu).<br>
            <div style="background:#ffffff; padding:12px; border-radius:8px; border:1px solid #fde68a; margin-top:10px; font-weight:normal;">${badT.theory}</div>`;
        }
        
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-result').classList.add('active');
    }

    // ==========================================
    // PHẦN 4: HÀM CHECK TƯƠNG TÁC LÝ THUYẾT
    // ==========================================
    function checkPracInput(el) {
        let val = el.value.trim().toLowerCase();
        let ans = el.getAttribute('data-ans').toLowerCase();
        
        if(val === "") {
            el.style.borderColor = '#cbd5e1'; el.style.backgroundColor = '#fff'; el.style.color = '#334155';
            return;
        }
        if(val === ans) {
            el.style.borderColor = 'var(--success)'; el.style.backgroundColor = '#d1fae5'; el.style.color = '#065f46';
        } else {
            el.style.borderColor = 'var(--danger)'; el.style.backgroundColor = '#ffe4e6'; el.style.color = '#9f1239';
        }
    }

    function checkPracSelect(el) {
        let val = el.value;
        let ans = el.getAttribute('data-ans');
        
        if(val === "") {
            el.style.borderColor = '#cbd5e1'; el.style.backgroundColor = '#fff'; el.style.color = '#334155';
        } else if(val === ans) {
            el.style.borderColor = 'var(--success)'; el.style.backgroundColor = '#d1fae5'; el.style.color = '#065f46';
        } else {
            el.style.borderColor = 'var(--danger)'; el.style.backgroundColor = '#ffe4e6'; el.style.color = '#9f1239';
        }
    }

    window.onload = () => switchTab('mixed');
</script>
